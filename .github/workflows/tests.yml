name: tests

# Проганяє tests/run_all.sh на кожен push і pull request.
# Потрібно, бо локально без робочого редактора Godot тести гри не запускаються.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Встановити Godot 4.7.2
        run: |
          curl -sSL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Встановити xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libfontconfig1

      - name: Імпорт ресурсів
        run: godot --headless --path . --import

      - name: Тести
        env:
          GODOT: godot
        run: bash tests/run_all.sh
