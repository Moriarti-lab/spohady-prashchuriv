<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Розкладка UI — Спогади пращурів</title>
<style>
  :root {
    --bg: #1e1a1a; --panel: #2a2222; --panel2: #3a2e2c;
    --gold: #e0a526; --linen: #f2ebdd; --dim: #b9ae9a;
    --red: #b3261e; --turq: #1f8f8b; --night: #141111;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); color: var(--linen);
    font: 14px/1.35 system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #topbar {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 6px 8px; background: var(--panel); border-bottom: 2px solid rgba(224,165,38,.35);
  }
  #topbar .spacer { flex: 1 1 20px; }
  select, button, input {
    font: inherit; color: var(--linen); background: var(--panel2);
    border: 1px solid rgba(224,165,38,.35); border-radius: 6px; padding: 4px 8px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--red); border-color: var(--red); }
  main { flex: 1 1 auto; display: flex; min-height: 0; }
  #palette {
    flex: 0 0 auto; width: 118px; overflow: auto; padding: 6px;
    background: var(--panel); display: flex; flex-direction: column; gap: 4px;
  }
  #palette button { text-align: left; padding: 5px 7px; font-size: 13px; }
  #canvas-wrap { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  #canvas {
    flex: 1 1 auto; width: 100%; min-height: 0; display: block;
    background: var(--night); touch-action: none;
  }
  #issues {
    flex: 0 0 auto; height: 108px; overflow: auto; background: var(--panel);
    border-top: 1px solid rgba(224,165,38,.25); padding: 4px 8px;
    font: 12px/1.4 ui-monospace, "Cascadia Code", monospace;
  }
  #issues .issue { cursor: pointer; padding: 1px 0; }
  #issues .issue:hover { background: rgba(224,165,38,.12); }
  #issues .err { color: #ff8b80; }
  #issues .warn { color: var(--gold); }
  #issues .ok { color: var(--turq); }
  #inspector {
    flex: 0 0 auto; width: 272px; overflow: auto; padding: 8px;
    background: var(--panel); border-left: 1px solid rgba(224,165,38,.25);
  }
  #inspector h2 { margin: 0 0 6px; font-size: 15px; color: var(--gold); font-weight: 600; }
  #inspector .row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; flex-wrap: wrap; }
  #inspector .row label { display: flex; gap: 6px; align-items: center; color: var(--dim); font-size: 12px; }
  #inspector .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
  #inspector .grid2 label { display: flex; gap: 4px; align-items: center; color: var(--dim); font-size: 12px; }
  #inspector select { width: 100%; }
  #inspector input[type=number], #inspector input[type=text] { width: 100%; min-width: 0; }
  #inspector input[type=number] { text-align: right; }
  #inspector .formula {
    font: 12px/1.45 ui-monospace, monospace; color: var(--gold);
    background: #1b1616; border: 1px solid rgba(224,165,38,.2);
    border-radius: 6px; padding: 6px; margin: 6px 0; white-space: pre-wrap;
  }
  #inspector .hint { color: var(--dim); font-size: 12px; margin: 8px 0; }
  .hidden { display: none !important; }
  #importBox, #copyBox {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .65); z-index: 50;
    display: flex; align-items: center; justify-content: center;
  }
  #importBox .card, #copyBox .card {
    background: var(--panel); border: 1px solid rgba(224,165,38,.35);
    border-radius: 12px; padding: 14px; width: min(720px, 92vw);
    display: flex; flex-direction: column; gap: 8px;
  }
  #importBox textarea, #copyBox textarea {
    width: 100%; height: 220px; background: #1b1616; color: var(--linen);
    border: 1px solid rgba(224,165,38,.3); border-radius: 8px; padding: 8px;
    font: 12px/1.4 ui-monospace, monospace; resize: vertical;
  }
  #importBox .row, #copyBox .row { display: flex; gap: 8px; flex-wrap: wrap; }
  /* Вузький екран (телефон у портреті): полотно зверху, палітра смугою, інспектор знизу. */
  @media (max-width: 820px) {
    main { flex-direction: column-reverse; }
    #palette {
      flex: 0 0 auto; width: auto; height: 46px; flex-direction: row;
      overflow-x: auto; overflow-y: hidden; gap: 6px; align-items: center;
    }
    #palette button { white-space: nowrap; padding: 4px 8px; }
    #canvas-wrap { flex: 1 1 auto; }
    #inspector {
      width: auto; height: 30vh; flex: 0 0 auto;
      border-left: 0; border-top: 1px solid rgba(224,165,38,.25);
    }
    #issues { height: 64px; }
    #topbar { gap: 4px; padding: 4px 6px; font-size: 13px; }
    #topbar select, #topbar button { padding: 3px 6px; }
  }
</style>
</head>
<body>

<header id="topbar">
  <select id="screenSel" title="Екран"></select>
  <button id="scrAdd" title="Новий екран">+</button>
  <button id="scrDup" title="Дубль екрана (варіант)">⧉</button>
  <button id="scrDel" title="Видалити екран">×</button>
  <select id="presetSel" title="Співвідношення сторін"></select>
  <button id="zoomOut" title="Зменшити">−</button>
  <span id="zoomLabel" style="min-width:44px;text-align:center">100%</span>
  <button id="zoomIn" title="Збільшити">+</button>
  <button id="zoomFit" title="Вписати полотно">Вписати</button>
  <button id="btnUndo" title="Скасувати (Ctrl+Z)">↶</button>
  <button id="btnRedo" title="Повторити (Ctrl+Shift+Z)">↷</button>
  <span id="status" style="color:var(--dim);font-size:12px"></span>
  <label style="display:flex;gap:4px;align-items:center;color:var(--dim)">
    <input type="checkbox" id="ghost"> контур «як зараз»
  </label>
  <button id="btnBg" title="Підкласти скріншот фоном">Фон…</button>
  <input type="file" id="bgFile" accept="image/*" class="hidden">
  <label id="bgOpacityBox" class="hidden" style="display:flex;gap:4px;align-items:center;color:var(--dim);font-size:12px">
    прозор.<input type="range" id="bgOpacity" min="0" max="100" style="width:70px;padding:0">
  </label>
  <button id="btnBgClear" class="hidden" title="Прибрати фон">✕</button>
  <span class="spacer"></span>
  <button id="btnExport" class="primary">Експорт JSON</button>
  <button id="btnCopy">Копіювати опис</button>
  <button id="btnImport">Імпорт</button>
  <button id="btnReset" title="Повернути шаблон">Скинути</button>
  <button id="btnHelp" title="Довідка">?</button>
</header>

<main>
  <aside id="palette"></aside>
  <div id="canvas-wrap">
    <svg id="canvas" preserveAspectRatio="xMidYMid meet"></svg>
    <aside id="issues"></aside>
  </div>
  <aside id="inspector"></aside>
</main>

<div id="copyBox" class="hidden">
  <div class="card">
    <b>Опис розкладки</b>
    <div class="hint" style="color:var(--dim);font-size:12px">Скопіюй текст і надішли його розробнику.</div>
    <textarea id="copyText" readonly></textarea>
    <div class="row">
      <button id="copyDone" class="primary">Готово</button>
    </div>
  </div>
</div>

<div id="importBox" class="hidden">
  <div class="card">
    <b>Імпорт розкладки</b>
    <textarea id="importText" placeholder="Встав JSON сюди або вибери файл"></textarea>
    <div class="row">
      <button id="importFileBtn">Файл…</button>
      <input type="file" id="importFile" accept=".json,application/json" class="hidden">
      <button id="importApply" class="primary">Застосувати</button>
      <button id="importCancel">Скасувати</button>
    </div>
  </div>
</div>

<script id="model">
// === MODEL START ===
const PRESETS = [
  { id: "19.5:9", w: 1560, h: 720, physical: "1024×473" },
  { id: "16:9",   w: 1280, h: 720, physical: "1280×720" },
  { id: "18:9",   w: 1440, h: 720, physical: "1080×540" },
  { id: "20:9",   w: 1600, h: 720, physical: "1280×576" },
  { id: "21:9",   w: 1680, h: 720, physical: "1080×463" }
];

const TYPES = ["btn", "skill", "attack", "potion", "stick", "bar", "minimap",
  "portrait", "panel", "slot", "grid", "tabs", "scroll", "label", "tracker",
  "dialog", "banner"];

const TYPE_DEFAULTS = {
  btn:      { w: 250, h: 58,  text: "Кнопка" },
  skill:    { w: 96,  h: 96,  text: "1" },
  attack:   { w: 160, h: 160, text: "Удар" },
  potion:   { w: 68,  h: 68,  text: "Життя" },
  stick:    { w: 200, h: 200, text: "" },
  bar:      { w: 240, h: 26,  text: "Життя" },
  minimap:  { w: 150, h: 150, text: "" },
  portrait: { w: 84,  h: 84,  text: "" },
  panel:    { w: 320, h: 400, text: "Панель" },
  slot:     { w: 68,  h: 68,  text: "" },
  grid:     { w: 438, h: 290, text: "Сітка" },
  tabs:     { w: 540, h: 56,  text: "Вкладки" },
  scroll:   { w: 300, h: 360, text: "Скрол" },
  label:    { w: 220, h: 26,  text: "Напис" },
  tracker:  { w: 250, h: 120, text: "Завдання" },
  dialog:   { w: 700, h: 300, text: "Діалог" },
  banner:   { w: 1000, h: 40, text: "" }
};

function widgetDefault(type) {
  const d = TYPE_DEFAULTS[type];
  return d ? { w: d.w, h: d.h, text: d.text } : null;
}

function defaultCanvas() {
  return { w: PRESETS[0].w, h: PRESETS[0].h };
}

function num(v, fallback) {
  return typeof v === "number" && isFinite(v) ? v : fallback;
}

function clampInt(v, lo, hi, def) {
  const n = Math.round(num(v, def));
  return Math.min(hi, Math.max(lo, n));
}

// Додає id до набору й робить його унікальним: a, a2, a3…
function uniqueId(base, used) {
  let id = base || "el";
  let n = 1;
  while (used.has(id)) {
    n++;
    id = base + n;
  }
  used.add(id);
  return id;
}

// Елемент шаблону: T(id, type, [l,t,r,b], [anchorH,anchorV...] | null, extra)
function T(id, type, o, a, extra) {
  const base = widgetDefault(type) || { text: "" };
  const el = {
    id: id,
    type: type,
    text: base.text,
    a: a ? { l: a[0], t: a[1], r: a[2], b: a[3] } : { l: "l", t: "t", r: "l", b: "t" },
    o: { l: o[0], t: o[1], r: o[2], b: o[3] },
    z: 0,
    locked: false,
    visible: true
  };
  if (extra) {
    if (typeof extra.text === "string") el.text = extra.text;
    if (typeof extra.z === "number") el.z = extra.z;
    if (extra.rel) el.rel = extra.rel;
    if (extra.ring) el.ring = { dist: extra.ring.dist, angles: extra.ring.angles.slice() };
  }
  return el;
}

function makeDefaultDoc() {
  const hud = [
    T("banner", "banner", [0, 144, 0, 224], ["l", "t", "r", "t"], { z: 1, text: "Рівень 2" }),
    T("toast", "banner", [0, -20, 0, 20], ["l", "m", "r", "m"], { z: 1 }),
    T("target", "panel", [-150, 6, 150, 66], ["c", "t", "c", "t"], { z: 2, text: "Ціль" }),
    T("quest", "tracker", [-290, 172, -16, 292], ["r", "t", "r", "t"], { z: 2, text: "Завдання" }),
    T("minimap", "minimap", [-166, 12, -16, 162], ["r", "t", "r", "t"], { z: 2 }),
    T("loc", "label", [-470, 14, -176, 40], ["r", "t", "r", "t"], { z: 2, text: "Селище" }),
    T("top", "panel", [16, 12, 396, 120], null, { z: 3, text: "Портрет · ім'я · життя · чар · досвід" }),
    T("submenu", "panel", [16, 126, 522, 312], null, { z: 3, text: "Сумка · Навички · Характеристики · Древо · Завдання · Меню" }),
    T("interact", "btn", [-170, -120, 170, -50], ["c", "b", "c", "b"], { z: 4, text: "Говорити" }),
    T("stick", "stick", [86, -266, 286, -66], ["l", "b", "l", "b"], { z: 4 }),
    T("attack", "attack", [-216, -206, -56, -46], ["r", "b", "r", "b"], {
      z: 5, ring: { dist: 156, angles: [172, 212, 252, 292] }
    }),
    T("skill0", "skill", [0, 0, 96, 96], null, { z: 4, text: "1", rel: { parent: "attack", angle: 172 } }),
    T("skill1", "skill", [0, 0, 96, 96], null, { z: 4, text: "2", rel: { parent: "attack", angle: 212 } }),
    T("skill2", "skill", [0, 0, 96, 96], null, { z: 4, text: "3", rel: { parent: "attack", angle: 252 } }),
    T("skill3", "skill", [0, 0, 96, 96], null, { z: 4, text: "4", rel: { parent: "attack", angle: 292 } }),
    T("potion_hp", "potion", [0, 0, 68, 68], null, {
      z: 4, text: "Життя", rel: { parent: "attack", mode: "offset", dx: 64, dy: -246 }
    }),
    T("potion_mana", "potion", [0, 0, 68, 68], null, {
      z: 4, text: "Чар", rel: { parent: "attack", mode: "offset", dx: -20, dy: -262 }
    })
  ];

  const bag = [
    T("frame", "panel", [10, 10, -10, -10], ["l", "t", "r", "b"], { z: 0 }),
    T("tabs", "tabs", [40, 20, 580, 76], null, { z: 2, text: "Сумка · Наузи · Характеристики" }),
    T("gold", "label", [-360, 20, -170, 76], ["r", "t", "r", "t"], { z: 2, text: "Гривні: 0" }),
    T("close", "btn", [-170, 20, -40, 76], ["r", "t", "r", "t"], { z: 2, text: "Закрити" }),
    T("equip", "grid", [20, 120, 242, 342], null, { z: 2, text: "Спорядження 3×3" }),
    T("baggrid", "grid", [260, 120, 698, 410], null, { z: 2, text: "Сумка 6×4" }),
    T("filters", "tabs", [260, 424, 698, 468], null, { z: 2, text: "Усе · Зброя · Броня" }),
    T("detail", "panel", [-840, 120, -10, -190], ["r", "t", "r", "b"], { z: 2, text: "Опис предмета" }),
    T("actions", "panel", [-380, -160, -10, -10], ["r", "b", "r", "b"], { z: 3, text: "Одягти · Продати · Ще" }),
    T("stash", "grid", [20, 560, 242, 700], null, { z: 2, text: "Скриня" })
  ];

  const stats = [
    T("frame", "panel", [10, 10, -10, -10], ["l", "t", "r", "b"], { z: 0 }),
    T("statsgrid", "panel", [20, 120, 620, 700], null, { z: 2, text: "Показники" }),
    T("skills", "panel", [-920, 120, -20, -20], ["r", "t", "r", "b"], { z: 2, text: "Навички" })
  ];

  const perks = [
    T("map", "panel", [0, 0, 0, 0], ["l", "t", "r", "b"], { z: 0, text: "Древо" }),
    T("topbar", "panel", [0, 0, 0, 84], ["l", "t", "r", "t"], { z: 2 }),
    T("detail", "panel", [-372, 92, -12, -16], ["r", "t", "r", "b"], { z: 3, text: "Деталі вузла" }),
    T("unlock", "btn", [-250, -76, -50, -16], ["r", "b", "r", "b"], { z: 3, text: "Відкрити" }),
    T("respec", "btn", [-290, 16, -50, 72], ["r", "t", "r", "t"], { z: 3, text: "Скинути" })
  ];

  const map = [
    T("mapview", "panel", [0, 0, 0, 0], ["l", "t", "r", "b"], { z: 0, text: "Карта" }),
    T("head", "panel", [0, 0, 0, 70], ["l", "t", "r", "t"], { z: 2, text: "Карта" }),
    T("close", "btn", [-180, 8, -40, 62], ["r", "t", "r", "t"], { z: 2, text: "Закрити" })
  ];

  return {
    version: 1,
    canvas: defaultCanvas(),
    screens: [
      { id: "hud", title: "HUD", elements: hud },
      { id: "bag", title: "Сумка", elements: bag },
      { id: "stats", title: "Характеристики", elements: stats },
      { id: "perks", title: "Древо", elements: perks },
      { id: "map", title: "Карта", elements: map }
    ]
  };
}

function findScreen(doc, id) {
  if (!doc || !Array.isArray(doc.screens)) return null;
  return doc.screens.find((s) => s.id === id) || null;
}

function findElement(doc, screenId, id) {
  const screen = findScreen(doc, screenId);
  if (!screen) return null;
  return screen.elements.find((e) => e.id === id) || null;
}

function normAnchor(a) {
  const src = a && typeof a === "object" ? a : {};
  const h = (v) => (v === "c" || v === "r" ? v : "l");
  const v = (v) => (v === "m" || v === "b" ? v : "t");
  return { l: h(src.l), t: v(src.t), r: h(src.r), b: v(src.b) };
}

function normOffsets(o, base, a) {
  const src = o && typeof o === "object" ? o : {};
  const anchor = a || { l: "l", t: "t", r: "l", b: "t" };
  let l = num(src.l, 0);
  let t = num(src.t, 0);
  let r = num(src.r, l + base.w);
  let b = num(src.b, t + base.h);
  // Стиснути можна лише фіксовану вісь: коли краї на різних якорях, це «тягнеться».
  if (anchor.l === anchor.r && r < l + 8) r = l + 8;
  if (anchor.t === anchor.b && b < t + 8) b = t + 8;
  return { l: l, t: t, r: r, b: b };
}

function normRel(rel) {
  const parent = String(rel.parent);
  if (rel.mode === "offset") {
    return { parent: parent, mode: "offset", dx: num(rel.dx, 0), dy: num(rel.dy, 0) };
  }
  return { parent: parent, angle: num(rel.angle, 0) };
}

function normRing(ring) {
  const angles = Array.isArray(ring.angles) && ring.angles.length
    ? ring.angles.map((a) => num(a, 0))
    : [172, 212, 252, 292];
  return { dist: num(ring.dist, 156), angles: angles };
}

function normalizeDoc(raw) {
  try {
    if (!raw || typeof raw !== "object" || !Array.isArray(raw.screens) || raw.screens.length === 0) {
      return makeDefaultDoc();
    }
    const canvas = raw.canvas && num(raw.canvas.w, 0) > 0 && num(raw.canvas.h, 0) > 0
      ? { w: Math.round(raw.canvas.w), h: Math.round(raw.canvas.h) }
      : defaultCanvas();
    const usedScreens = new Set();
    const screens = [];
    for (const rs of raw.screens) {
      if (!rs || typeof rs !== "object") continue;
      const sid = uniqueId(String(rs.id || "screen"), usedScreens);
      const screen = { id: sid, title: typeof rs.title === "string" ? rs.title : sid, elements: [] };
      if (rs.bg && typeof rs.bg === "object" && typeof rs.bg.dataUrl === "string") {
        const op = num(rs.bg.opacity, 0.6);
        screen.bg = { dataUrl: rs.bg.dataUrl, opacity: Math.min(1, Math.max(0, op)) };
      }
      const usedEls = new Set();
      const list = Array.isArray(rs.elements) ? rs.elements : [];
      for (const re of list) {
        if (!re || typeof re !== "object") continue;
        const type = typeof re.type === "string" && re.type ? re.type : "panel";
        const base = widgetDefault(type) || widgetDefault("panel");
        const anchor = normAnchor(re.a);
        const el = {
          id: uniqueId(String(re.id || type), usedEls),
          type: type,
          text: typeof re.text === "string" ? re.text : base.text,
          a: anchor,
          o: normOffsets(re.o, base, anchor),
          z: clampInt(re.z, 0, 99, 0),
          locked: !!re.locked,
          visible: re.visible !== false
        };
        if (re.rel && typeof re.rel === "object" && typeof re.rel.parent === "string") {
          el.rel = normRel(re.rel);
        }
        if (re.ring && typeof re.ring === "object") el.ring = normRing(re.ring);
        for (const k of Object.keys(re)) if (!(k in el)) el[k] = re[k];
        screen.elements.push(el);
      }
      screens.push(screen);
    }
    if (!screens.length) return makeDefaultDoc();
    return { version: 1, canvas: canvas, screens: screens };
  } catch (e) {
    return makeDefaultDoc();
  }
}

function serializeEl(el) {
  const out = {};
  out.a = { l: el.a.l, t: el.a.t, r: el.a.r, b: el.a.b };
  out.id = el.id;
  out.locked = !!el.locked;
  out.o = {
    l: Math.round(el.o.l), t: Math.round(el.o.t),
    r: Math.round(el.o.r), b: Math.round(el.o.b)
  };
  if (el.rel) {
    out.rel = el.rel.mode === "offset"
      ? { parent: el.rel.parent, mode: "offset", dx: Math.round(el.rel.dx), dy: Math.round(el.rel.dy) }
      : { parent: el.rel.parent, angle: Math.round(el.rel.angle) };
  }
  if (el.ring) {
    out.ring = { dist: Math.round(el.ring.dist), angles: el.ring.angles.map((a) => Math.round(a)) };
  }
  out.text = el.text;
  out.type = el.type;
  out.visible = el.visible !== false;
  out.z = Math.round(el.z);
  for (const k of Object.keys(el).sort()) if (!(k in out)) out[k] = el[k];
  return out;
}

function serialize(doc) {
  const d = normalizeDoc(doc);
  const out = {
    version: 1,
    canvas: { w: Math.round(d.canvas.w), h: Math.round(d.canvas.h) },
    screens: d.screens.map((s) => {
      const o = {};
      if (s.bg) o.bg = { dataUrl: s.bg.dataUrl, opacity: s.bg.opacity };
      o.elements = s.elements.map(serializeEl);
      o.id = s.id;
      o.title = s.title;
      return o;
    })
  };
  return JSON.stringify(out, null, 2);
}

function addElement(doc, screenId, type, at) {
  const screen = findScreen(doc, screenId);
  if (!screen) return null;
  const base = widgetDefault(type) || { w: 100, h: 40, text: "" };
  const used = new Set(screen.elements.map((e) => e.id));
  const id = uniqueId(type, used);
  const x = Math.round(num(at && at.x, 0));
  const y = Math.round(num(at && at.y, 0));
  let z = 0;
  for (const e of screen.elements) z = Math.max(z, e.z);
  screen.elements.push({
    id: id,
    type: type,
    text: base.text,
    a: { l: "l", t: "t", r: "l", b: "t" },
    o: { l: x, t: y, r: x + base.w, b: y + base.h },
    z: Math.min(99, z + 1),
    locked: false,
    visible: true
  });
  return id;
}

const CIRCULAR_TYPES = ["attack", "skill", "potion", "stick"];

function edgePos(anchor, size) {
  if (anchor === "c" || anchor === "m") return size / 2;
  if (anchor === "r" || anchor === "b") return size;
  return 0;
}

function rectFromEdges(el, canvas) {
  const x1 = edgePos(el.a.l, canvas.w) + el.o.l;
  const x2 = edgePos(el.a.r, canvas.w) + el.o.r;
  const y1 = edgePos(el.a.t, canvas.h) + el.o.t;
  const y2 = edgePos(el.a.b, canvas.h) + el.o.b;
  return { x: x1, y: y1, w: Math.max(8, x2 - x1), h: Math.max(8, y2 - y1) };
}

// Позиції всіх елементів екрана: спершу абсолютні, потім ті, що прив'язані до батька.
function resolvePositions(screen, canvas) {
  const out = new Map();
  if (!screen || !Array.isArray(screen.elements)) return out;
  const byId = new Map(screen.elements.map((e) => [e.id, e]));
  const abs = screen.elements.filter((e) => !e.rel);
  for (const el of abs) out.set(el.id, rectFromEdges(el, canvas));
  let pending = screen.elements.filter((e) => e.rel);
  for (let pass = 0; pass < 6 && pending.length; pass++) {
    const next = [];
    for (const el of pending) {
      const parent = out.get(el.rel.parent);
      if (!parent) {
        next.push(el);
        continue;
      }
      const w = Math.max(8, Math.abs(el.o.r - el.o.l));
      const h = Math.max(8, Math.abs(el.o.b - el.o.t));
      const pcx = parent.x + parent.w / 2;
      const pcy = parent.y + parent.h / 2;
      let cx;
      let cy;
      if (el.rel.mode === "offset") {
        cx = pcx + el.rel.dx;
        cy = pcy + el.rel.dy;
      } else {
        const parentEl = byId.get(el.rel.parent);
        const dist = parentEl && parentEl.ring ? parentEl.ring.dist : 156;
        const a = (el.rel.angle * Math.PI) / 180;
        cx = pcx + Math.cos(a) * dist;
        cy = pcy + Math.sin(a) * dist;
      }
      out.set(el.id, { x: cx - w / 2, y: cy - h / 2, w: w, h: h });
    }
    pending = next;
  }
  for (const el of pending) out.set(el.id, rectFromEdges(el, canvas));
  return out;
}

// Вираз у стилі коду: vs.x - 136, vs.x + 16, vs.x/2 - 150.
function axisExpr(anchor, offset) {
  const base = anchor === "c" || anchor === "m" ? "vs.x/2" : "vs.x";
  const n = Math.round(offset);
  if (n === 0) return base;
  return base + (n > 0 ? " + " + n : " - " + Math.abs(n));
}

function axisExprY(anchor, offset) {
  const base = anchor === "m" ? "vs.y/2" : "vs.y";
  const n = Math.round(offset);
  if (n === 0) return base;
  return base + (n > 0 ? " + " + n : " - " + Math.abs(n));
}

function formulaText(el, canvas, positions, screen) {
  if (el.rel) {
    if (el.rel.mode === "offset") {
      const dx = Math.round(el.rel.dx);
      const dy = Math.round(el.rel.dy);
      return "зсув " + el.rel.parent + ": " + (dx >= 0 ? "+" + dx : dx) + ", " + (dy >= 0 ? "+" + dy : dy);
    }
    const parent = screen && Array.isArray(screen.elements)
      ? screen.elements.find((e) => e.id === el.rel.parent)
      : null;
    const dist = parent && parent.ring ? Math.round(parent.ring.dist) : null;
    return "кут " + Math.round(el.rel.angle) + "°" +
      (dist === null ? "" : ", радіус " + dist) + " (від " + el.rel.parent + ")";
  }
  const parts = [];
  const stretchX = el.a.l !== el.a.r;
  const stretchY = el.a.t !== el.a.b;
  if (stretchX) {
    parts.push("ширина: " + axisExpr(el.a.l, el.o.l) + " … " + axisExpr(el.a.r, el.o.r));
  }
  if (stretchY) {
    parts.push("висота: " + axisExprY(el.a.t, el.o.t) + " … " + axisExprY(el.a.b, el.o.b));
  }
  const pr = positions ? positions.get(el.id) : null;
  const w = pr ? Math.round(pr.w) : Math.round(Math.abs(el.o.r - el.o.l));
  const h = pr ? Math.round(pr.h) : Math.round(Math.abs(el.o.b - el.o.t));
  if (CIRCULAR_TYPES.indexOf(el.type) >= 0) {
    parts.push("центр: x = " + axisExpr(el.a.l, el.o.l + w / 2) + ", y = " +
      axisExprY(el.a.t, el.o.t + h / 2) + ", ⌀ " + w);
  } else if (!stretchX || !stretchY) {
    if (!stretchX) parts.push("x = " + axisExpr(el.a.l, el.o.l));
    if (!stretchY) parts.push("y = " + axisExprY(el.a.t, el.o.t));
    parts.push(w + "×" + h);
  }
  return parts.join(" · ");
}

const INTERACTIVE_TYPES = ["btn", "skill", "attack", "potion", "stick", "slot", "tabs"];
const CONTAINER_TYPES = ["panel", "scroll", "dialog", "grid"];
const MIN_TARGET = { w: 40, h: 36 };
const SAFE_ZONE = 36;

function presetsFor(doc) {
  const list = PRESETS.slice();
  const known = list.some((p) => p.w === doc.canvas.w && p.h === doc.canvas.h);
  if (!known) list.push({ id: "custom", w: doc.canvas.w, h: doc.canvas.h, physical: "своя" });
  return list;
}

function isInteractive(el) {
  return INTERACTIVE_TYPES.indexOf(el.type) >= 0;
}

function contains(a, b) {
  return a.x <= b.x && a.y <= b.y && a.x + a.w >= b.x + b.w && a.y + a.h >= b.y + b.h;
}

function validateDoc(doc) {
  const out = [];
  const d = doc;
  for (const preset of presetsFor(d)) {
    const canvas = { w: preset.w, h: preset.h };
    for (const screen of d.screens) {
      const pos = resolvePositions(screen, canvas);
      const els = screen.elements;
      const add = (el, code, level, msg) => out.push({
        screenId: screen.id, elId: el.id, presetId: preset.id, code: code, level: level, msg: msg
      });
      for (const el of els) {
        const r = pos.get(el.id);
        if (!r) continue;
        if (r.x < -2 || r.y < -2 || r.x + r.w > canvas.w + 2 || r.y + r.h > canvas.h + 2) {
          add(el, "offscreen", "error", "виходить за екран");
          continue;
        }
        if (isInteractive(el)) {
          if (r.w < MIN_TARGET.w || r.h < MIN_TARGET.h) add(el, "small_target", "warn", "менше 40×36");
          const near = Math.min(r.x, r.y, canvas.w - (r.x + r.w), canvas.h - (r.y + r.h));
          if (near < SAFE_ZONE) add(el, "safe_zone", "warn", "у безпечній зоні");
        }
        if (el.rel) {
          const parent = els.find((e) => e.id === el.rel.parent);
          if (!parent) {
            add(el, "missing_parent", "error", "немає батька " + el.rel.parent);
          } else if (el.rel.mode !== "offset" && parent.ring) {
            const pr = pos.get(parent.id);
            if (pr) {
              const dcen = Math.hypot(
                r.x + r.w / 2 - (pr.x + pr.w / 2),
                r.y + r.h / 2 - (pr.y + pr.h / 2)
              );
              const radii = Math.min(r.w, r.h) / 2 + Math.min(pr.w, pr.h) / 2;
              if (dcen < radii + 2) add(el, "ring_overlap", "warn", "перекриває кільце");
            }
          }
        }
      }
      for (let i = 0; i < els.length; i++) {
        for (let j = i + 1; j < els.length; j++) {
          const a = els[i];
          const b = els[j];
          if (!isInteractive(a) || !isInteractive(b)) continue;
          const ra = pos.get(a.id);
          const rb = pos.get(b.id);
          if (!ra || !rb) continue;
          const circA = CIRCULAR_TYPES.indexOf(a.type) >= 0;
          const circB = CIRCULAR_TYPES.indexOf(b.type) >= 0;
          if (circA && circB) {
            const dc = Math.hypot(
              ra.x + ra.w / 2 - (rb.x + rb.w / 2),
              ra.y + ra.h / 2 - (rb.y + rb.h / 2)
            );
            if (dc >= Math.min(ra.w, ra.h) / 2 + Math.min(rb.w, rb.h) / 2 - 2) continue;
            add(a, "overlap", "warn", "перетинає " + b.id);
            continue;
          }
          const ix = Math.min(ra.x + ra.w, rb.x + rb.w) - Math.max(ra.x, rb.x);
          const iy = Math.min(ra.y + ra.h, rb.y + rb.h) - Math.max(ra.y, rb.y);
          if (ix <= 1 || iy <= 1) continue;
          if (CONTAINER_TYPES.indexOf(a.type) >= 0 && contains(ra, rb)) continue;
          if (CONTAINER_TYPES.indexOf(b.type) >= 0 && contains(rb, ra)) continue;
          add(a, "overlap", "warn", "перетинає " + b.id);
        }
      }
    }
  }
  return out;
}

function countByLevel(issues) {
  const out = { error: 0, warn: 0 };
  for (const i of issues) {
    if (i.level === "error") out.error++;
    else out.warn++;
  }
  return out;
}

const MIN_SIZE = 8;

function guessAnchors(rect, canvas, threshold) {
  const th = num(threshold, 12);
  const axis = (start, size, total, isY) => {
    const end = total - (start + size);
    const center = Math.abs(start + size / 2 - total / 2);
    if (center <= th) return isY ? "m" : "c";
    if (start <= end) return isY ? "t" : "l";
    return isY ? "b" : "r";
  };
  const h = axis(rect.x, rect.w, canvas.w, false);
  const v = axis(rect.y, rect.h, canvas.h, true);
  return { l: h, t: v, r: h, b: v };
}

function snapEdge(value, targets, threshold) {
  const th = num(threshold, 6);
  let best = value;
  let bestD = th + 1;
  for (const t of targets) {
    const d = Math.abs(t - value);
    if (d <= th && d < bestD) {
      bestD = d;
      best = t;
    }
  }
  return best;
}

function setElementRect(doc, screenId, elId, rect, canvas) {
  const screen = findScreen(doc, screenId);
  const el = findElement(doc, screenId, elId);
  if (!el || !screen) return doc;
  const w = Math.max(MIN_SIZE, num(rect.w, MIN_SIZE));
  const h = Math.max(MIN_SIZE, num(rect.h, MIN_SIZE));
  const x = num(rect.x, 0);
  const y = num(rect.y, 0);
  if (el.rel) {
    const pos = resolvePositions(screen, canvas);
    const parent = pos.get(el.rel.parent);
    if (parent) {
      const cx = x + w / 2;
      const cy = y + h / 2;
      const pcx = parent.x + parent.w / 2;
      const pcy = parent.y + parent.h / 2;
      if (el.rel.mode === "offset") {
        el.rel.dx = Math.round(cx - pcx);
        el.rel.dy = Math.round(cy - pcy);
      } else {
        el.rel.angle = Math.round((Math.atan2(cy - pcy, cx - pcx) * 180) / Math.PI);
      }
    }
    el.o = { l: 0, t: 0, r: Math.round(w), b: Math.round(h) };
    return doc;
  }
  const guessed = guessAnchors({ x: x, y: y, w: w, h: h }, canvas);
  const stretchX = el.a.l !== el.a.r;
  const stretchY = el.a.t !== el.a.b;
  el.a = {
    l: stretchX ? el.a.l : guessed.l,
    r: stretchX ? el.a.r : guessed.r,
    t: stretchY ? el.a.t : guessed.t,
    b: stretchY ? el.a.b : guessed.b
  };
  el.o = {
    l: Math.round(x - edgePos(el.a.l, canvas.w)),
    t: Math.round(y - edgePos(el.a.t, canvas.h)),
    r: Math.round(x + w - edgePos(el.a.r, canvas.w)),
    b: Math.round(y + h - edgePos(el.a.b, canvas.h))
  };
  return doc;
}

function setElement(doc, screenId, elId, patch) {
  const el = findElement(doc, screenId, elId);
  if (!el || !patch) return doc;
  if (typeof patch.text === "string") el.text = patch.text;
  if (patch.z !== undefined) el.z = clampInt(patch.z, 0, 99, el.z);
  if (patch.locked !== undefined) el.locked = !!patch.locked;
  if (patch.visible !== undefined) el.visible = !!patch.visible;
  return doc;
}

function applyInspector(doc, screenId, elId, field, value, canvas) {
  const screen = findScreen(doc, screenId);
  const el = findElement(doc, screenId, elId);
  if (!el || !screen) return doc;
  if (field === "text" || field === "z" || field === "locked" || field === "visible") {
    const patch = {};
    patch[field] = value;
    return setElement(doc, screenId, elId, patch);
  }
  const pos = resolvePositions(screen, canvas);
  const r = pos.get(elId);
  if (!r) return doc;
  const rect = { x: r.x, y: r.y, w: r.w, h: r.h };
  if (field === "x") rect.x = num(value, r.x);
  else if (field === "y") rect.y = num(value, r.y);
  else if (field === "w") rect.w = Math.max(MIN_SIZE, num(value, r.w));
  else if (field === "h") rect.h = Math.max(MIN_SIZE, num(value, r.h));
  else if (field === "anchorL" || field === "anchorR" || field === "anchorT" || field === "anchorB") {
    const key = field.slice(-1).toLowerCase();
    const v = String(value);
    el.a[key] = v;
    if (key === "l") el.o.l = Math.round(rect.x - edgePos(v, canvas.w));
    if (key === "r") el.o.r = Math.round(rect.x + rect.w - edgePos(v, canvas.w));
    if (key === "t") el.o.t = Math.round(rect.y - edgePos(v, canvas.h));
    if (key === "b") el.o.b = Math.round(rect.y + rect.h - edgePos(v, canvas.h));
    return doc;
  } else {
    return doc;
  }
  return setElementRect(doc, screenId, elId, rect, canvas);
}

function addScreen(doc, id, title) {
  const used = new Set(doc.screens.map((s) => s.id));
  const sid = uniqueId(String(id || "screen"), used);
  doc.screens.push({ id: sid, title: String(title || "Екран"), elements: [] });
  return sid;
}

function renameScreen(doc, id, title) {
  const screen = findScreen(doc, id);
  if (screen) screen.title = String(title);
  return doc;
}

function deleteScreen(doc, id) {
  if (doc.screens.length <= 1) return false;
  const i = doc.screens.findIndex((s) => s.id === id);
  if (i < 0) return false;
  doc.screens.splice(i, 1);
  return true;
}

function duplicateScreen(doc, id, newTitle) {
  const screen = findScreen(doc, id);
  if (!screen) return null;
  const usedScreens = new Set(doc.screens.map((s) => s.id));
  const sid = uniqueId(screen.id, usedScreens);
  const map = new Map();
  const usedEls = new Set();
  const elements = screen.elements.map((el) => {
    const ne = JSON.parse(JSON.stringify(el));
    ne.id = uniqueId(el.id, usedEls);
    map.set(el.id, ne.id);
    return ne;
  });
  for (const el of elements) {
    if (el.rel && map.has(el.rel.parent)) el.rel.parent = map.get(el.rel.parent);
  }
  const copy = { id: sid, title: String(newTitle || screen.title + " v2"), elements: elements };
  if (screen.bg) copy.bg = JSON.parse(JSON.stringify(screen.bg));
  doc.screens.push(copy);
  return sid;
}

function duplicateElements(doc, screenId, ids) {
  const screen = findScreen(doc, screenId);
  if (!screen) return [];
  const used = new Set(screen.elements.map((e) => e.id));
  const out = [];
  for (const id of ids) {
    const el = screen.elements.find((e) => e.id === id);
    if (!el) continue;
    const ne = JSON.parse(JSON.stringify(el));
    ne.id = uniqueId(el.id, used);
    if (!ne.rel) {
      ne.o = {
        l: ne.o.l + 8, t: ne.o.t + 8, r: ne.o.r + 8, b: ne.o.b + 8
      };
    }
    screen.elements.push(ne);
    out.push(ne.id);
  }
  return out;
}

function removeElements(doc, screenId, ids) {
  const screen = findScreen(doc, screenId);
  if (!screen) return doc;
  const kill = new Set(ids);
  screen.elements = screen.elements.filter((e) => !kill.has(e.id));
  return doc;
}

function reorderZ(doc, screenId, id, dir) {
  const el = findElement(doc, screenId, id);
  if (!el) return doc;
  el.z = clampInt(el.z + (dir > 0 ? 1 : -1), 0, 99, el.z);
  return doc;
}

function alignSelection(doc, screenId, ids, mode) {
  const screen = findScreen(doc, screenId);
  if (!screen || !ids.length) return doc;
  const canvas = doc.canvas;
  const pos = resolvePositions(screen, canvas);
  const rects = ids.map((id) => pos.get(id)).filter(Boolean);
  if (rects.length < 2) return doc;
  const minX = Math.min(...rects.map((r) => r.x));
  const maxX = Math.max(...rects.map((r) => r.x + r.w));
  const minY = Math.min(...rects.map((r) => r.y));
  const maxY = Math.max(...rects.map((r) => r.y + r.h));
  for (const id of ids) {
    const r = pos.get(id);
    if (!r) continue;
    let x = r.x;
    let y = r.y;
    if (mode === "left") x = minX;
    else if (mode === "right") x = maxX - r.w;
    else if (mode === "centerX") x = (minX + maxX) / 2 - r.w / 2;
    else if (mode === "top") y = minY;
    else if (mode === "bottom") y = maxY - r.h;
    else if (mode === "middleY") y = (minY + maxY) / 2 - r.h / 2;
    setElementRect(doc, screenId, id, { x: x, y: y, w: r.w, h: r.h }, canvas);
  }
  return doc;
}

function copyElements(doc, screenId, ids) {
  const screen = findScreen(doc, screenId);
  if (!screen) return [];
  return ids
    .map((id) => screen.elements.find((e) => e.id === id))
    .filter(Boolean)
    .map((el) => JSON.parse(JSON.stringify(el)));
}

function pasteElements(doc, targetScreenId, clip) {
  const screen = findScreen(doc, targetScreenId);
  if (!screen || !Array.isArray(clip) || !clip.length) return [];
  const used = new Set(screen.elements.map((e) => e.id));
  const copies = clip.map((el) => {
    const ne = JSON.parse(JSON.stringify(el));
    ne.id = uniqueId(el.id, used);
    return ne;
  });
  const ids = new Set(copies.map((e) => e.id));
  const srcIds = new Set(clip.map((e) => e.id));
  for (const el of copies) {
    if (el.rel && !srcIds.has(el.rel.parent)) delete el.rel;
    if (!el.rel) {
      el.o = { l: el.o.l + 8, t: el.o.t + 8, r: el.o.r + 8, b: el.o.b + 8 };
    }
  }
  for (const el of copies) screen.elements.push(el);
  return [...ids];
}

// Знімкова історія: push(поточний стан) після кожної зміни.
function createHistory(limit) {
  const max = Math.max(1, Math.round(num(limit, 50)));
  const snaps = [];
  let idx = -1;
  return {
    push: function (doc) {
      const s = serialize(doc);
      if (idx >= 0 && snaps[idx] === s) return;
      snaps.splice(idx + 1);
      snaps.push(s);
      if (snaps.length > max) snaps.shift();
      idx = snaps.length - 1;
    },
    undo: function () {
      if (idx <= 0) return null;
      idx--;
      return normalizeDoc(JSON.parse(snaps[idx]));
    },
    redo: function () {
      if (idx < 0 || idx >= snaps.length - 1) return null;
      idx++;
      return normalizeDoc(JSON.parse(snaps[idx]));
    },
    size: function () { return snaps.length; },
    clear: function () { snaps.length = 0; idx = -1; }
  };
}

const BACKGROUND_LIMIT = 600000;

function bgPolicy(bytes) {
  return num(bytes, 0) <= BACKGROUND_LIMIT ? "embed" : "local";
}

function setBackground(doc, screenId, bg) {
  const screen = findScreen(doc, screenId);
  if (!screen) return doc;
  if (!bg || typeof bg.dataUrl !== "string" || bg.dataUrl.length > BACKGROUND_LIMIT) {
    screen.bg = null;
    return doc;
  }
  const op = Math.min(1, Math.max(0, num(bg.opacity, 0.6)));
  screen.bg = { dataUrl: bg.dataUrl, opacity: op };
  return doc;
}

function summaryText(doc) {
  const d = normalizeDoc(doc);
  const c = d.canvas;
  const lines = [];
  for (const screen of d.screens) {
    lines.push(screen.title + " · " + Math.round(c.w) + "×" + Math.round(c.h));
    const pos = resolvePositions(screen, c);
    const els = screen.elements.slice().sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    for (const el of els) {
      const r = pos.get(el.id);
      const size = r ? Math.round(r.w) + "×" + Math.round(r.h) : "?";
      lines.push(el.id.padEnd(10) + " " + (size + "  ").padEnd(10) + " " + formulaText(el, c, pos, screen));
    }
    lines.push("");
  }
  return lines.join("\n").trimEnd();
}

function distributeSelection(doc, screenId, ids, axis) {
  const screen = findScreen(doc, screenId);
  if (!screen || !Array.isArray(ids) || ids.length < 3) return doc;
  const canvas = doc.canvas;
  const pos = resolvePositions(screen, canvas);
  const items = ids.map((id) => ({ id: id, r: pos.get(id) })).filter((it) => !!it.r);
  if (items.length < 3) return doc;
  const horiz = axis !== "y";
  items.sort((a, b) => (horiz ? a.r.x - b.r.x : a.r.y - b.r.y));
  const first = items[0].r;
  const last = items[items.length - 1].r;
  const start = horiz ? first.x : first.y;
  const end = horiz ? last.x + last.w : last.y + last.h;
  const total = items.reduce((sum, it) => sum + (horiz ? it.r.w : it.r.h), 0);
  const gap = (end - start - total) / (items.length - 1);
  let cursor = start;
  for (const it of items) {
    const r = it.r;
    setElementRect(doc, screenId, it.id, {
      x: horiz ? cursor : r.x,
      y: horiz ? r.y : cursor,
      w: r.w, h: r.h
    }, canvas);
    cursor += (horiz ? r.w : r.h) + gap;
  }
  return doc;
}

if (typeof module !== "undefined") {
  module.exports = {
    PRESETS, TYPES, TYPE_DEFAULTS, defaultCanvas, widgetDefault,
    makeDefaultDoc, normalizeDoc, serialize, findScreen, findElement, addElement,
    edgePos, rectFromEdges, resolvePositions, formulaText, CIRCULAR_TYPES,
    INTERACTIVE_TYPES, CONTAINER_TYPES, MIN_TARGET, SAFE_ZONE, validateDoc, countByLevel, presetsFor,
    MIN_SIZE, guessAnchors, snapEdge, setElementRect, setElement, applyInspector,
    addScreen, renameScreen, deleteScreen, duplicateScreen, duplicateElements, removeElements,
    reorderZ, alignSelection, distributeSelection, copyElements, pasteElements, createHistory,
    BACKGROUND_LIMIT, bgPolicy, setBackground, summaryText
  };
}
// === MODEL END ===
</script>

<script id="app">
/* ------------------------------------------------------------------ стан */
const STORAGE_KEY = "spohady.uiLayout.v1";
const S = {
  doc: null,
  screenId: "hud",
  presetId: PRESETS[0].id,
  zoom: 1,
  pan: { x: 0, y: 0 },
  selection: new Set(),
  history: null,
  ghost: false,
  primary: null,
  clip: [],
  localBg: {}
};
const $ = (id) => document.getElementById(id);
const svg = $("canvas");
const NS = "http://www.w3.org/2000/svg";

function svgEl(tag, attrs) {
  const el = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function canvasSize() {
  const p = PRESETS.find((x) => x.id === S.presetId);
  return p ? { w: p.w, h: p.h } : { w: S.doc.canvas.w, h: S.doc.canvas.h };
}

function currentScreen() {
  return findScreen(S.doc, S.screenId) || S.doc.screens[0];
}

function selectedElements() {
  const screen = currentScreen();
  if (!screen) return [];
  return screen.elements.filter((e) => S.selection.has(e.id));
}

let pendingCheckpoint = false;

function checkpoint() {
  pendingCheckpoint = true;
}

function setStatus(text) {
  const el = $("status");
  if (el) el.textContent = text || "";
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, serialize(S.doc));
  } catch (e) {
    setStatus("автозбереження недоступне");
  }
}

function save() {
  if (pendingCheckpoint && S.history) {
    S.history.push(S.doc);
    pendingCheckpoint = false;
  }
  persist();
}

function loadInitialDoc() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return normalizeDoc(JSON.parse(raw));
  } catch (e) {
    setStatus("збережене не читається — відкрито шаблон");
  }
  return makeDefaultDoc();
}

function applyRestored(doc) {
  S.doc = doc;
  if (!findScreen(S.doc, S.screenId)) S.screenId = S.doc.screens[0].id;
  S.selection.clear();
  persist();
  fillScreenSelect();
  renderAll();
}

function undo() {
  if (!S.history) return;
  const d = S.history.undo();
  if (d) applyRestored(d);
}

function redo() {
  if (!S.history) return;
  const d = S.history.redo();
  if (d) applyRestored(d);
}

/* ------------------------------------------------------------ полотно */
function applyView() {
  const c = canvasSize();
  svg.setAttribute("viewBox", S.pan.x + " " + S.pan.y + " " + c.w / S.zoom + " " + c.h / S.zoom);
  $("zoomLabel").textContent = Math.round(S.zoom * 100) + "%";
}

function renderGrid() {
  const c = canvasSize();
  const g = svgEl("g", { id: "grid" });
  for (let x = 0; x <= c.w; x += 40) {
    g.appendChild(svgEl("line", {
      x1: x, y1: 0, x2: x, y2: c.h,
      stroke: x % 200 === 0 ? "rgba(224,165,38,0.16)" : "rgba(242,235,221,0.05)",
      "stroke-width": 1
    }));
  }
  for (let y = 0; y <= c.h; y += 40) {
    g.appendChild(svgEl("line", {
      x1: 0, y1: y, x2: c.w, y2: y,
      stroke: y % 200 === 0 ? "rgba(224,165,38,0.16)" : "rgba(242,235,221,0.05)",
      "stroke-width": 1
    }));
  }
  g.appendChild(svgEl("rect", {
    x: 36, y: 36, width: c.w - 72, height: c.h - 72,
    fill: "none", stroke: "rgba(31,143,139,0.45)", "stroke-dasharray": "10 8", "stroke-width": 2
  }));
  g.appendChild(svgEl("rect", {
    x: 0, y: 0, width: c.w, height: c.h,
    fill: "none", stroke: "rgba(224,165,38,0.6)", "stroke-width": 3
  }));
  return g;
}

const FILLS = {
  panel: "rgba(58,46,44,0.55)",
  scroll: "rgba(58,46,44,0.4)",
  dialog: "rgba(58,46,44,0.65)",
  btn: "rgba(179,38,30,0.45)",
  tabs: "rgba(179,38,30,0.3)",
  attack: "rgba(179,38,30,0.6)",
  skill: "rgba(31,143,139,0.45)",
  potion: "rgba(199,53,43,0.35)",
  stick: "rgba(242,235,221,0.07)",
  bar: "rgba(199,53,43,0.5)",
  minimap: "rgba(31,143,139,0.22)",
  portrait: "rgba(242,235,221,0.14)",
  slot: "rgba(242,235,221,0.07)",
  grid: "rgba(242,235,221,0.05)",
  label: "rgba(242,235,221,0.1)",
  tracker: "rgba(224,165,38,0.2)",
  banner: "rgba(224,165,38,0.14)"
};

function shapeFor(el, r, selected) {
  const g = svgEl("g", { class: "el", "data-id": el.id });
  const circular = CIRCULAR_TYPES.indexOf(el.type) >= 0;
  const fill = FILLS[el.type] || "rgba(242,235,221,0.1)";
  const stroke = selected ? "#E0A526" : "rgba(224,165,38,0.45)";
  const sw = selected ? 3 : (el.type === "grid" || el.type === "slot" ? 1 : 1.5);
  if (el.rel) g.setAttribute("data-rel", "1");
  if (circular) {
    g.appendChild(svgEl("circle", {
      cx: r.x + r.w / 2, cy: r.y + r.h / 2, r: Math.min(r.w, r.h) / 2,
      fill: fill, stroke: stroke, "stroke-width": sw,
      "stroke-dasharray": el.locked ? "6 4" : ""
    }));
  } else {
    g.appendChild(svgEl("rect", {
      x: r.x, y: r.y, width: r.w, height: r.h, rx: 6,
      fill: fill, stroke: stroke, "stroke-width": sw,
      "stroke-dasharray": el.locked ? "6 4" : (el.type === "grid" || el.type === "slot" ? "5 4" : "")
    }));
  }
  if (el.text) {
    const t = svgEl("text", {
      x: r.x + r.w / 2, y: r.y + r.h / 2,
      "text-anchor": "middle", "dominant-baseline": "central",
      fill: "#F2EBDD", "font-size": Math.max(10, Math.min(16, r.h * 0.28)),
      "pointer-events": "none", opacity: 0.85
    });
    const max = Math.max(4, Math.floor(r.w / 9));
    t.textContent = el.text.length > max ? el.text.slice(0, max - 1) + "…" : el.text;
    g.appendChild(t);
  }
  return g;
}

function handleRects(r) {
  const s = 9;
  const hx = [r.x, r.x + r.w / 2, r.x + r.w];
  const hy = [r.y, r.y + r.h / 2, r.y + r.h];
  const names = ["nw", "n", "ne", "w", "e", "sw", "s", "se"];
  const out = [];
  let i = 0;
  for (let yi = 0; yi < 3; yi++) {
    for (let xi = 0; xi < 3; xi++) {
      if (xi === 1 && yi === 1) continue;
      out.push({ name: names[i++], x: hx[xi] - s / 2, y: hy[yi] - s / 2, size: s });
    }
  }
  return out;
}

function bgOf(screen) {
  if (!screen) return null;
  if (screen.bg) return screen.bg;
  return S.localBg[screen.id] || null;
}

function renderCanvas() {
  const screen = currentScreen();
  const pos = screen ? resolvePositions(screen, canvasSize()) : new Map();
  svg.replaceChildren();
  const c = canvasSize();
  const bg = bgOf(screen);
  if (bg) {
    svg.appendChild(svgEl("image", {
      href: bg.dataUrl, x: 0, y: 0, width: c.w, height: c.h,
      preserveAspectRatio: "xMidYMid slice", opacity: bg.opacity,
      "pointer-events": "none"
    }));
  }
  svg.appendChild(renderGrid());
  const g = svgEl("g", { id: "els" });
  if (screen) {
    const list = screen.elements.slice().sort((a, b) => a.z - b.z);
    for (const el of list) {
      if (el.visible === false) continue;
      const r = pos.get(el.id);
      if (r) g.appendChild(shapeFor(el, r, S.selection.has(el.id)));
    }
  }
  if (S.ghost && screen) {
    const tpl = findScreen(TEMPLATE_DOC, screen.id);
    if (tpl) {
      const tpos = resolvePositions(tpl, c);
      const ghost = svgEl("g", { id: "ghost", "pointer-events": "none" });
      for (const el of screen.elements) {
        const a = tpos.get(el.id);
        const b = pos.get(el.id);
        if (!a || !b) continue;
        if (Math.abs(a.x - b.x) < 1 && Math.abs(a.y - b.y) < 1 &&
            Math.abs(a.w - b.w) < 1 && Math.abs(a.h - b.h) < 1) continue;
        ghost.appendChild(svgEl("rect", {
          x: a.x, y: a.y, width: a.w, height: a.h, rx: 6,
          fill: "none", stroke: "rgba(94,200,255,0.55)", "stroke-dasharray": "7 6", "stroke-width": 1.5
        }));
      }
      svg.appendChild(ghost);
    }
  }
  if (gesture && gesture.kind === "marquee") {
    const x1 = Math.min(gesture.start.x, gesture.current.x);
    const y1 = Math.min(gesture.start.y, gesture.current.y);
    const x2 = Math.max(gesture.start.x, gesture.current.x);
    const y2 = Math.max(gesture.start.y, gesture.current.y);
    svg.appendChild(svgEl("rect", {
      id: "marquee", x: x1, y: y1, width: x2 - x1, height: y2 - y1,
      fill: "rgba(224,165,38,0.08)", stroke: "rgba(224,165,38,0.7)",
      "stroke-dasharray": "6 4", "pointer-events": "none"
    }));
  }
  svg.appendChild(g);
  updateBgControls(bg);
  const sel = selectedElements();
  if (sel.length === 1 && !sel[0].locked) {
    const r = pos.get(sel[0].id);
    if (r) {
      const hg = svgEl("g", { id: "handles" });
      for (const h of handleRects(r)) {
        hg.appendChild(svgEl("rect", {
          x: h.x, y: h.y, width: h.size, height: h.size,
          "data-handle": h.name, fill: "#E0A526", stroke: "#1E1A1A", "stroke-width": 1,
          style: "cursor:" + (h.name.length === 2
            ? (h.name === "nw" || h.name === "se" ? "nwse-resize" : "nesw-resize")
            : (h.name === "n" || h.name === "s" ? "ns-resize" : "ew-resize"))
        }));
      }
      svg.appendChild(hg);
    }
  }
  applyView();
}

function renderAll() {
  renderCanvas();
  renderInspector();
  renderIssues();
}

/* ------------------------------------------------------------ виділення */
function selectOnly(id) {
  S.selection = new Set(id ? [id] : []);
  S.primary = id || null;
}

function toggleSelect(id) {
  if (S.selection.has(id)) S.selection.delete(id);
  else S.selection.add(id);
  S.primary = id;
}

/* ------------------------------------------------------------ жести */
function toCanvas(evt) {
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX;
  pt.y = evt.clientY;
  const m = svg.getScreenCTM();
  if (!m) return { x: 0, y: 0 };
  const p = pt.matrixTransform(m.inverse());
  return { x: p.x, y: p.y };
}

let gesture = null;

function snapTargets(exclude) {
  const c = canvasSize();
  const xs = [0, 36, c.w - 36, c.w, c.w / 2];
  const ys = [0, 36, c.h - 36, c.h, c.h / 2];
  const screen = currentScreen();
  const pos = resolvePositions(screen, c);
  for (const el of screen.elements) {
    if (exclude.has(el.id)) continue;
    const r = pos.get(el.id);
    if (!r) continue;
    xs.push(r.x, r.x + r.w, r.x + r.w / 2);
    ys.push(r.y, r.y + r.h, r.y + r.h / 2);
  }
  return { xs: xs, ys: ys };
}

function onPointerDown(evt) {
  if (evt.button !== undefined && evt.button !== 0) return;
  const target = evt.target;
  const handleEl = target.closest ? target.closest("[data-handle]") : null;
  const elEl = target.closest ? target.closest(".el") : null;
  const p = toCanvas(evt);
  if (handleEl && S.selection.size === 1) {
    const el = selectedElements()[0];
    const r = resolvePositions(currentScreen(), canvasSize()).get(el.id);
    checkpoint();
    gesture = { kind: "resize", handle: handleEl.getAttribute("data-handle"), start: p, rect: r, id: el.id };
  } else if (elEl) {
    const id = elEl.getAttribute("data-id");
    if (evt.shiftKey) toggleSelect(id);
    else if (!S.selection.has(id)) selectOnly(id);
    else S.primary = id;
    if (!S.selection.has(id)) return;
    const pos = resolvePositions(currentScreen(), canvasSize());
    const rects = new Map();
    for (const sel of selectedElements()) if (pos.get(sel.id)) rects.set(sel.id, pos.get(sel.id));
    checkpoint();
    gesture = { kind: "move", start: p, rects: rects, primary: S.primary };
    renderAll();
  } else if (evt.shiftKey) {
    gesture = { kind: "marquee", start: p, current: p };
    renderCanvas();
  } else {
    selectOnly(null);
    gesture = { kind: "pan", start: p, pan: { x: S.pan.x, y: S.pan.y } };
    renderAll();
  }
  if (evt.pointerId !== undefined && svg.setPointerCapture) {
    try { svg.setPointerCapture(evt.pointerId); } catch (e) { /* ignore */ }
  }
  evt.preventDefault();
}

function onPointerMove(evt) {
  if (!gesture) return;
  const p = toCanvas(evt);
  const c = canvasSize();
  if (gesture.kind === "pan") {
    S.pan = { x: gesture.pan.x - (p.x - gesture.start.x), y: gesture.pan.y - (p.y - gesture.start.y) };
    applyView();
    return;
  }
  if (gesture.kind === "marquee") {
    gesture.current = p;
    const x1 = Math.min(gesture.start.x, p.x);
    const y1 = Math.min(gesture.start.y, p.y);
    const x2 = Math.max(gesture.start.x, p.x);
    const y2 = Math.max(gesture.start.y, p.y);
    const screen = currentScreen();
    const pos = resolvePositions(screen, canvasSize());
    const picked = new Set();
    for (const el of screen.elements) {
      const r = pos.get(el.id);
      if (!r) continue;
      if (r.x >= x1 && r.y >= y1 && r.x + r.w <= x2 && r.y + r.h <= y2) picked.add(el.id);
    }
    S.selection = picked;
    S.primary = picked.size ? [...picked][0] : null;
    renderCanvas();
    return;
  }
  if (gesture.kind === "move") {
    let dx = p.x - gesture.start.x;
    let dy = p.y - gesture.start.y;
    const primary = gesture.primary && gesture.rects.get(gesture.primary);
    if (primary) {
      const t = snapTargets(new Set(gesture.rects.keys()));
      const adjLeft = snapEdge(primary.x + dx, t.xs) - (primary.x + dx);
      const adjRight = snapEdge(primary.x + primary.w + dx, t.xs) - (primary.x + primary.w + dx);
      if (Math.abs(adjLeft) <= Math.abs(adjRight) && adjLeft !== 0) dx += adjLeft;
      else if (adjRight !== 0) dx += adjRight;
      const adjTop = snapEdge(primary.y + dy, t.ys) - (primary.y + dy);
      const adjBottom = snapEdge(primary.y + primary.h + dy, t.ys) - (primary.y + primary.h + dy);
      if (Math.abs(adjTop) <= Math.abs(adjBottom) && adjTop !== 0) dy += adjTop;
      else if (adjBottom !== 0) dy += adjBottom;
    }
    for (const [id, r] of gesture.rects) {
      setElementRect(S.doc, S.screenId, id, { x: r.x + dx, y: r.y + dy, w: r.w, h: r.h }, c);
    }
    renderAll();
    return;
  }
  if (gesture.kind === "resize") {
    const r0 = gesture.rect;
    let { x, y, w, h } = r0;
    const dx = p.x - gesture.start.x;
    const dy = p.y - gesture.start.y;
    const H = gesture.handle;
    if (H.indexOf("w") >= 0) { x += dx; w -= dx; }
    if (H.indexOf("e") >= 0) { w += dx; }
    if (H.indexOf("n") >= 0) { y += dy; h -= dy; }
    if (H.indexOf("s") >= 0) { h += dy; }
    if (w < MIN_SIZE) { if (H.indexOf("w") >= 0) x = r0.x + r0.w - MIN_SIZE; w = MIN_SIZE; }
    if (h < MIN_SIZE) { if (H.indexOf("n") >= 0) y = r0.y + r0.h - MIN_SIZE; h = MIN_SIZE; }
    setElementRect(S.doc, S.screenId, gesture.id, { x: x, y: y, w: w, h: h }, c);
    renderAll();
  }
}

function onPointerUp() {
  if (!gesture) return;
  gesture = null;
  save();
  renderAll();
}

/* -------------------------------------------------------------- події */
function setZoom(z) {
  S.zoom = Math.min(2, Math.max(0.25, z));
  applyView();
}

function moveSelection(dx, dy) {
  const screen = currentScreen();
  const pos = resolvePositions(screen, canvasSize());
  const c = canvasSize();
  const sel = selectedElements();
  if (!sel.length) return;
  checkpoint();
  for (const el of sel) {
    const r = pos.get(el.id);
    if (!r) continue;
    setElementRect(S.doc, S.screenId, el.id, { x: r.x + dx, y: r.y + dy, w: r.w, h: r.h }, c);
  }
  save();
  renderAll();
}

function fillScreenSelect() {
  const sel = $("screenSel");
  sel.replaceChildren();
  for (const s of S.doc.screens) {
    const o = document.createElement("option");
    o.value = s.id;
    o.textContent = s.title;
    sel.appendChild(o);
  }
  sel.value = S.screenId;
}

function wireTopbar() {
  $("zoomIn").addEventListener("click", () => setZoom(S.zoom * 1.25));
  $("zoomOut").addEventListener("click", () => setZoom(S.zoom / 1.25));
  $("zoomFit").addEventListener("click", () => {
    S.zoom = 1;
    S.pan = { x: 0, y: 0 };
    applyView();
  });
  $("presetSel").addEventListener("change", (e) => {
    S.presetId = e.target.value;
    renderAll();
  });
  $("screenSel").addEventListener("change", (e) => {
    S.screenId = e.target.value;
    S.selection.clear();
    renderAll();
  });
  $("btnUndo").addEventListener("click", undo);
  $("btnRedo").addEventListener("click", redo);
  $("btnReset").addEventListener("click", () => {
    if (!window.confirm("Повернути шаблон? Поточна розкладка зникне.")) return;
    S.doc = makeDefaultDoc();
    S.screenId = S.doc.screens[0].id;
    S.selection.clear();
    if (S.history) {
      S.history.clear();
      S.history.push(S.doc);
    }
    persist();
    fillScreenSelect();
    renderAll();
  });
  $("scrAdd").addEventListener("click", () => {
    const title = window.prompt("Назва нового екрана", "Екран");
    if (title === null) return;
    checkpoint();
    const id = addScreen(S.doc, "screen", title || "Екран");
    S.screenId = id;
    S.selection.clear();
    save();
    fillScreenSelect();
    renderAll();
  });
  $("scrDup").addEventListener("click", () => {
    checkpoint();
    const id = duplicateScreen(S.doc, S.screenId);
    if (id) S.screenId = id;
    save();
    fillScreenSelect();
    renderAll();
  });
  $("scrDel").addEventListener("click", () => {
    const screen = currentScreen();
    if (!screen) return;
    if (!window.confirm("Видалити екран «" + screen.title + "»?")) return;
    checkpoint();
    if (deleteScreen(S.doc, screen.id)) {
      S.screenId = S.doc.screens[0].id;
      S.selection.clear();
      save();
      fillScreenSelect();
      renderAll();
    }
  });
  const ps = $("presetSel");
  for (const p of PRESETS) {
    const o = document.createElement("option");
    o.value = p.id;
    o.textContent = p.id + " · " + p.w + "×" + p.h + " (" + p.physical + ")";
    ps.appendChild(o);
  }
  ps.value = S.presetId;
}

svg.addEventListener("pointerdown", onPointerDown);
svg.addEventListener("pointermove", onPointerMove);
svg.addEventListener("pointerup", onPointerUp);
svg.addEventListener("pointercancel", onPointerUp);
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  setZoom(S.zoom * (e.deltaY > 0 ? 0.9 : 1.1));
}, { passive: false });
window.addEventListener("keydown", (e) => {
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  const step = e.shiftKey ? 8 : 1;
  if (e.key === "ArrowLeft") { moveSelection(-step, 0); e.preventDefault(); }
  else if (e.key === "ArrowRight") { moveSelection(step, 0); e.preventDefault(); }
  else if (e.key === "ArrowUp") { moveSelection(0, -step); e.preventDefault(); }
  else if (e.key === "ArrowDown") { moveSelection(0, step); e.preventDefault(); }
  else if (e.key === "Escape") { selectOnly(null); renderAll(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
    exportJson();
    e.preventDefault();
  }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
    if (e.shiftKey) redo(); else undo();
    e.preventDefault();
  }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "d") {
    if (!S.selection.size) return;
    checkpoint();
    const ids = duplicateElements(S.doc, S.screenId, [...S.selection]);
    S.selection = new Set(ids);
    save();
    renderAll();
    e.preventDefault();
  }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "c") {
    if (S.selection.size) { copySelection(); e.preventDefault(); }
  }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "v") {
    if (S.clip.length) { pasteClip(); e.preventDefault(); }
  }
  else if ((e.key === "Delete" || e.key === "Backspace") && typeof removeElements === "function") {
    checkpoint();
    removeElements(S.doc, S.screenId, [...S.selection]);
    S.selection.clear();
    save();
    renderAll();
  }
});

const TYPE_LABELS = {
  btn: "Кнопка", skill: "Навичка", attack: "Удар", potion: "Зілля",
  stick: "Джойстик", bar: "Смуга", minimap: "Мінікарта", portrait: "Портрет",
  panel: "Панель", slot: "Слот", grid: "Сітка", tabs: "Вкладки",
  scroll: "Скрол", label: "Напис", tracker: "Трекер", dialog: "Діалог",
  banner: "Банер"
};

function labelled(text, input) {
  const wrap = document.createElement("label");
  const span = document.createElement("span");
  span.textContent = text;
  wrap.appendChild(span);
  wrap.appendChild(input);
  return wrap;
}

function makeSelect(options, value, onChange) {
  const sel = document.createElement("select");
  for (const [v, label] of options) {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = label;
    sel.appendChild(o);
  }
  sel.value = value;
  sel.addEventListener("change", () => onChange(sel.value));
  return sel;
}

function applyAxisAnchor(el, axis, mode) {
  const c = canvasSize();
  const r = resolvePositions(currentScreen(), c).get(el.id);
  if (!r) return;
  checkpoint();
  if (axis === "h") {
    if (mode === "stretch") {
      el.a.l = "l";
      el.a.r = "r";
      el.o.l = Math.round(r.x);
      el.o.r = Math.round(r.x + r.w - c.w);
    } else {
      el.a.l = mode;
      el.a.r = mode;
      el.o.l = Math.round(r.x - edgePos(mode, c.w));
      el.o.r = el.o.l + Math.round(r.w);
    }
  } else {
    if (mode === "stretch") {
      el.a.t = "t";
      el.a.b = "b";
      el.o.t = Math.round(r.y);
      el.o.b = Math.round(r.y + r.h - c.h);
    } else {
      el.a.t = mode;
      el.a.b = mode;
      el.o.t = Math.round(r.y - edgePos(mode, c.h));
      el.o.b = el.o.t + Math.round(r.h);
    }
  }
  save();
  renderAll();
}

function renderInspector() {
  const box = $("inspector");
  box.replaceChildren();
  const h = document.createElement("h2");
  h.textContent = "Інспектор";
  box.appendChild(h);
  const sel = selectedElements();
  if (sel.length !== 1) {
    const d = document.createElement("div");
    d.className = "hint";
    d.textContent = sel.length ? "Виділено елементів: " + sel.length + " (рухаються разом)" : "Виберіть елемент на полотні";
    box.appendChild(d);
    if (sel.length > 1) {
      const ids = sel.map((e) => e.id);
      const bar = document.createElement("div");
      bar.className = "row";
      const align = (mode, label, title) => {
        const b = document.createElement("button");
        b.textContent = label;
        b.title = title;
        b.addEventListener("click", () => {
          checkpoint();
          alignSelection(S.doc, S.screenId, ids, mode);
          save();
          renderAll();
        });
        return b;
      };
      bar.appendChild(align("left", "⬅", "Вирівняти по лівому"));
      bar.appendChild(align("centerX", "↔", "По центру X"));
      bar.appendChild(align("right", "➡", "По правому"));
      bar.appendChild(align("top", "⬆", "По верхньому"));
      bar.appendChild(align("middleY", "↕", "По центру Y"));
      bar.appendChild(align("bottom", "⬇", "По нижньому"));
      box.appendChild(bar);
      if (ids.length >= 3) {
        const bar3 = document.createElement("div");
        bar3.className = "row";
        const dist = (axis, label, title) => {
          const b = document.createElement("button");
          b.textContent = label;
          b.title = title;
          b.addEventListener("click", () => {
            checkpoint();
            distributeSelection(S.doc, S.screenId, ids, axis);
            save();
            renderAll();
          });
          return b;
        };
        bar3.appendChild(dist("x", "⇹ X", "Рівні проміжки по X"));
        bar3.appendChild(dist("y", "⇹ Y", "Рівні проміжки по Y"));
        box.appendChild(bar3);
      }
      const bar2 = document.createElement("div");
      bar2.className = "row";
      const cp = document.createElement("button");
      cp.textContent = "Копіювати";
      cp.addEventListener("click", () => copySelection());
      bar2.appendChild(cp);
      box.appendChild(bar2);
    } else if (sel.length === 0 && S.clip.length) {
      const b = document.createElement("button");
      b.textContent = "Вставити (" + S.clip.length + ")";
      b.addEventListener("click", () => pasteClip());
      box.appendChild(b);
    }
    return;
  }
  const el = sel[0];
  const screen = currentScreen();
  const c = canvasSize();
  const pos = resolvePositions(screen, c);
  const r = pos.get(el.id) || { x: 0, y: 0, w: 0, h: 0 };

  const idLine = document.createElement("div");
  idLine.className = "hint";
  idLine.textContent = el.id + " · " + (TYPE_LABELS[el.type] || el.type) + (el.rel ? " · кільце" : "");
  box.appendChild(idLine);

  const anchors = document.createElement("div");
  anchors.className = "row";
  anchors.appendChild(labelled("Гориз.", makeSelect(
    [["l", "ліво"], ["c", "центр"], ["r", "право"], ["stretch", "тягнеться"]],
    el.a.l === el.a.r ? el.a.l : "stretch",
    (v) => applyAxisAnchor(el, "h", v)
  )));
  box.appendChild(anchors);
  const anchorsV = document.createElement("div");
  anchorsV.className = "row";
  anchorsV.appendChild(labelled("Верт.", makeSelect(
    [["t", "верх"], ["m", "середина"], ["b", "низ"], ["stretch", "тягнеться"]],
    el.a.t === el.a.b ? el.a.t : "stretch",
    (v) => applyAxisAnchor(el, "v", v)
  )));
  box.appendChild(anchorsV);

  const grid = document.createElement("div");
  grid.className = "grid2";
  for (const key of ["x", "y", "w", "h"]) {
    const inp = document.createElement("input");
    inp.type = "number";
    inp.step = "1";
    inp.value = String(Math.round(r[key]));
    inp.dataset.field = key;
    grid.appendChild(labelled(key, inp));
  }
  box.appendChild(grid);

  const text = document.createElement("input");
  text.type = "text";
  text.value = el.text;
  text.dataset.field = "text";
  const textRow = document.createElement("div");
  textRow.className = "row";
  textRow.appendChild(labelled("Напис", text));
  box.appendChild(textRow);

  const zRow = document.createElement("div");
  zRow.className = "row";
  const z = document.createElement("input");
  z.type = "number";
  z.min = "0";
  z.max = "99";
  z.value = String(el.z);
  z.dataset.field = "z";
  zRow.appendChild(labelled("z", z));
  const zUp = document.createElement("button");
  zUp.textContent = "↑";
  zUp.title = "Вище";
  zUp.addEventListener("click", () => {
    checkpoint();
    reorderZ(S.doc, S.screenId, el.id, 1);
    save();
    renderAll();
  });
  const zDn = document.createElement("button");
  zDn.textContent = "↓";
  zDn.title = "Нижче";
  zDn.addEventListener("click", () => {
    checkpoint();
    reorderZ(S.doc, S.screenId, el.id, -1);
    save();
    renderAll();
  });
  zRow.appendChild(zUp);
  zRow.appendChild(zDn);
  box.appendChild(zRow);

  const checks = document.createElement("div");
  checks.className = "row";
  const lock = document.createElement("input");
  lock.type = "checkbox";
  lock.checked = !!el.locked;
  lock.dataset.field = "locked";
  const vis = document.createElement("input");
  vis.type = "checkbox";
  vis.checked = el.visible !== false;
  vis.dataset.field = "visible";
  checks.appendChild(labelled("замок", lock));
  checks.appendChild(labelled("видиме", vis));
  box.appendChild(checks);

  const formula = document.createElement("div");
  formula.className = "formula";
  formula.textContent = formulaText(el, c, pos, screen);
  box.appendChild(formula);

  const actions = document.createElement("div");
  actions.className = "row";
  const dup = document.createElement("button");
  dup.textContent = "Дублювати";
  dup.addEventListener("click", () => {
    if (typeof duplicateElements !== "function") return;
    checkpoint();
    const ids = duplicateElements(S.doc, S.screenId, [el.id]);
    S.selection = new Set(ids);
    save();
    renderAll();
  });
  const del = document.createElement("button");
  del.textContent = "Видалити";
  del.addEventListener("click", () => {
    if (typeof removeElements !== "function") return;
    checkpoint();
    removeElements(S.doc, S.screenId, [el.id]);
    S.selection.clear();
    save();
    renderAll();
  });
  const cp = document.createElement("button");
  cp.textContent = "Копіювати";
  cp.addEventListener("click", () => copySelection());
  actions.appendChild(dup);
  actions.appendChild(cp);
  actions.appendChild(del);
  box.appendChild(actions);
}

let issuesAllPresets = true;

function renderIssues() {
  if (gesture && (gesture.kind === "move" || gesture.kind === "resize")) return;
  const box = $("issues");
  const all = validateDoc(S.doc);
  const counts = countByLevel(all);
  const shown = all
    .filter((i) => issuesAllPresets || i.presetId === S.presetId)
    .sort((a, b) => (a.level === b.level ? 0 : a.level === "error" ? -1 : 1));
  box.replaceChildren();
  const head = document.createElement("div");
  head.style.cssText = "display:flex;gap:10px;align-items:center;margin-bottom:2px";
  const title = document.createElement("span");
  title.className = counts.error ? "err" : "ok";
  title.textContent = "Перевірки: " + counts.error + " помилок · " + counts.warn + " попереджень";
  const toggle = document.createElement("button");
  toggle.textContent = issuesAllPresets ? "усі пресети" : "поточний пресет";
  toggle.style.fontSize = "11px";
  toggle.style.padding = "1px 6px";
  toggle.addEventListener("click", () => {
    issuesAllPresets = !issuesAllPresets;
    renderIssues();
  });
  head.appendChild(title);
  head.appendChild(toggle);
  box.appendChild(head);
  if (!shown.length) {
    const d = document.createElement("div");
    d.className = "ok";
    d.textContent = "зауважень немає";
    box.appendChild(d);
    return;
  }
  let n = 0;
  for (const i of shown) {
    if (n++ >= 60) break;
    const row = document.createElement("div");
    row.className = "issue " + (i.level === "error" ? "err" : "warn");
    const scr = findScreen(S.doc, i.screenId);
    row.textContent = i.presetId + " · " + (scr ? scr.title : i.screenId) + " · " + i.elId + " — " + i.msg;
    row.addEventListener("click", () => focusIssue(i));
    box.appendChild(row);
  }
}

function focusIssue(issue) {
  S.screenId = issue.screenId;
  const known = PRESETS.find((p) => p.id === issue.presetId);
  if (known) {
    S.presetId = known.id;
    $("presetSel").value = known.id;
  }
  fillScreenSelect();
  S.selection = new Set([issue.elId]);
  const r = resolvePositions(currentScreen(), canvasSize()).get(issue.elId);
  if (r) {
    const c = canvasSize();
    S.pan = {
      x: r.x + r.w / 2 - c.w / (2 * S.zoom),
      y: r.y + r.h / 2 - c.h / (2 * S.zoom)
    };
  }
  renderAll();
}

function onInspectorInput(e) {
  const field = e.target.dataset ? e.target.dataset.field : null;
  if (!field) return;
  const sel = selectedElements();
  if (sel.length !== 1) return;
  const el = sel[0];
  let value = e.target.value;
  if (e.target.type === "checkbox") value = e.target.checked;
  else if (e.target.type === "number") value = Number(value);
  checkpoint();
  applyInspector(S.doc, S.screenId, el.id, field, value, canvasSize());
  save();
  renderCanvas();
  const f = $("inspector").querySelector(".formula");
  if (f) f.textContent = formulaText(el, canvasSize(), resolvePositions(currentScreen(), canvasSize()), currentScreen());
}

$("inspector").addEventListener("input", onInspectorInput);
$("inspector").addEventListener("change", onInspectorInput);

const TEMPLATE_DOC = makeDefaultDoc();

function updateBgControls(bg) {
  const box = $("bgOpacityBox");
  const clear = $("btnBgClear");
  if (bg) {
    box.classList.remove("hidden");
    clear.classList.remove("hidden");
    $("bgOpacity").value = String(Math.round(bg.opacity * 100));
  } else {
    box.classList.add("hidden");
    clear.classList.add("hidden");
  }
}

function wireBackground() {
  $("btnBg").addEventListener("click", () => $("bgFile").click());
  $("bgFile").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result);
      checkpoint();
      if (bgPolicy(dataUrl.length) === "local") {
        S.localBg[S.screenId] = { dataUrl: dataUrl, opacity: 0.5 };
        setBackground(S.doc, S.screenId, null);
        setStatus("важкий фон лишається лише в цьому браузері");
      } else {
        delete S.localBg[S.screenId];
        setBackground(S.doc, S.screenId, { dataUrl: dataUrl, opacity: 0.5 });
      }
      save();
      renderAll();
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  });
  $("bgOpacity").addEventListener("input", (e) => {
    const bg = bgOf(currentScreen());
    if (!bg) return;
    bg.opacity = Math.min(1, Math.max(0, Number(e.target.value) / 100));
    if (currentScreen().bg) persist();
    renderCanvas();
  });
  $("btnBgClear").addEventListener("click", () => {
    checkpoint();
    delete S.localBg[S.screenId];
    setBackground(S.doc, S.screenId, null);
    save();
    renderAll();
  });
  $("ghost").addEventListener("change", (e) => {
    S.ghost = e.target.checked;
    renderCanvas();
  });
}

function exportJson() {
  const text = serialize(S.doc);
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "ui_layout.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  setStatus("експортовано ui_layout.json");
}

function openCopyBox(text) {
  $("copyText").value = text;
  $("copyBox").classList.remove("hidden");
  $("copyText").focus();
  $("copyText").select();
}

function copySummary() {
  const text = summaryText(S.doc);
  const manual = () => {
    openCopyBox(text);
    setStatus("скопіюй вручну: текст виділено");
  };
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove();
    if (ok) setStatus("опис скопійовано");
    else manual();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => setStatus("опис скопійовано"), fallback);
  } else {
    fallback();
  }
}

function openImport() {
  $("importBox").classList.remove("hidden");
  $("importText").focus();
}

function closeImport() {
  $("importBox").classList.add("hidden");
  $("importText").value = "";
}

function importJson(text) {
  let raw;
  try {
    raw = JSON.parse(text);
  } catch (e) {
    setStatus("Це не JSON");
    return false;
  }
  const next = normalizeDoc(raw);
  checkpoint();
  S.doc = next;
  S.screenId = next.screens[0].id;
  S.selection.clear();
  delete S.localBg;
  S.localBg = {};
  save();
  fillScreenSelect();
  renderAll();
  closeImport();
  setStatus("імпортовано: " + next.screens.length + " екранів");
  return true;
}

function wireExport() {
  $("btnExport").addEventListener("click", exportJson);
  $("btnCopy").addEventListener("click", copySummary);
  $("btnImport").addEventListener("click", openImport);
  $("copyDone").addEventListener("click", () => $("copyBox").classList.add("hidden"));
  $("importCancel").addEventListener("click", closeImport);
  $("importApply").addEventListener("click", () => importJson($("importText").value));
  $("importFileBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { $("importText").value = String(reader.result); };
    reader.readAsText(file);
    e.target.value = "";
  });
  $("btnHelp").addEventListener("click", () => {
    window.alert(
      "Гарячі клавіші:\n" +
      "←↑→↓ — зсув на 1, Shift — на 8\n" +
      "Ctrl+D — дубль, Ctrl+C / Ctrl+V — копія й вставка\n" +
      "Ctrl+Z / Ctrl+Shift+Z — скасувати / повторити\n" +
      "Delete — видалити, Esc — зняти виділення\n" +
      "Ctrl+S — експорт JSON\n" +
      "Колесо — масштаб, тягання порожнього — панорама"
    );
  });
}

function copySelection() {
  const ids = [...S.selection];
  if (!ids.length) return;
  S.clip = copyElements(S.doc, S.screenId, ids);
  renderAll();
}

function pasteClip() {
  if (!S.clip.length) return;
  checkpoint();
  const ids = pasteElements(S.doc, S.screenId, S.clip);
  S.selection = new Set(ids);
  save();
  renderAll();
}

let palettePending = null;

function buildPalette() {
  const box = $("palette");
  for (const type of TYPES) {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.type = type;
    b.textContent = TYPE_LABELS[type] || type;
    box.appendChild(b);
  }
  box.addEventListener("pointerdown", (e) => {
    const b = e.target.closest("button");
    if (b) palettePending = b.dataset.type;
  });
  window.addEventListener("pointerup", (e) => {
    if (!palettePending) return;
    const type = palettePending;
    palettePending = null;
    const rect = svg.getBoundingClientRect();
    let at;
    if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
      at = toCanvas(e);
    } else {
      const c = canvasSize();
      at = { x: S.pan.x + c.w / S.zoom / 2, y: S.pan.y + c.h / S.zoom / 2 };
    }
    const def = widgetDefault(type) || { w: 100, h: 40 };
    checkpoint();
    const id = addElement(S.doc, S.screenId, type, { x: at.x - def.w / 2, y: at.y - def.h / 2 });
    if (id) S.selection = new Set([id]);
    save();
    renderAll();
  });
}

buildPalette();
wireBackground();
wireExport();
S.doc = loadInitialDoc();
S.history = createHistory(50);
S.history.push(S.doc);
fillScreenSelect();
wireTopbar();
renderAll();
</script>
