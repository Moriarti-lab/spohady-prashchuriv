<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Редактор Древа звитяги — «Спогади пращурів»</title>
<style>
:root { --bg:#16120f; --panel:#241d18; --panel2:#2e251e; --line:#5b4630; --gold:#d9b25b; --text:#f1e6cf; --dim:#a89a82; --bad:#e0624f; --good:#7cbf5a; --warn:#e0b04f; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
#app { display:grid; height:100%; grid-template-rows:auto 1fr; grid-template-columns:1fr; }
#bar { display:flex; flex-wrap:wrap; gap:6px; padding:6px; background:var(--panel); border-bottom:2px solid var(--line); align-items:center; }
#bar .grp { display:flex; gap:4px; flex-wrap:wrap; }
#bar .sep { width:1px; height:30px; background:var(--line); margin:0 2px; }
button, select, input, textarea { font:inherit; color:var(--text); }
button { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:9px 11px; min-height:42px; cursor:pointer; touch-action:manipulation; }
button:active { background:#43362a; }
button.on { background:var(--gold); color:#20170c; border-color:var(--gold); font-weight:600; }
button.danger { border-color:var(--bad); color:#ffb4a8; }
button:disabled { opacity:.4; }
#main { display:grid; min-height:0; grid-template-columns:1fr; grid-template-rows:1fr auto; }
#stage { position:relative; min-height:0; overflow:hidden; background:radial-gradient(circle at 50% 50%, #251d16, #120e0b); }
canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
#hint { position:absolute; left:8px; bottom:8px; right:8px; pointer-events:none; color:var(--dim); font-size:13px; text-shadow:0 1px 2px #000; }
#toast { position:absolute; left:50%; top:10px; transform:translateX(-50%); background:#000d; border:1px solid var(--gold); padding:8px 14px; border-radius:10px; display:none; max-width:90%; z-index:5; text-align:center; }
#side { background:var(--panel); border-top:2px solid var(--line); max-height:42vh; overflow:auto; padding:8px; }
#side h3 { margin:0 0 6px; font-size:15px; color:var(--gold); }
.row { display:flex; gap:6px; margin-bottom:6px; align-items:center; flex-wrap:wrap; }
.row > label { flex:0 0 96px; color:var(--dim); font-size:13px; }
.row > input, .row > select, .row > textarea { flex:1 1 140px; min-width:0; background:#17120e; border:1px solid var(--line); border-radius:6px; padding:8px; min-height:38px; }
.stats { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:6px; margin:4px 0 8px; }
.stats div { display:flex; align-items:center; gap:4px; }
.stats label { flex:1; font-size:12px; color:var(--dim); }
.stats input { width:64px; background:#17120e; border:1px solid var(--line); border-radius:6px; padding:6px; min-height:34px; }
.badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px; border:1px solid var(--line); margin-right:4px; }
#dlg { position:fixed; inset:0; background:#000c; display:none; align-items:center; justify-content:center; z-index:10; padding:8px; }
#dlg .box { background:var(--panel); border:2px solid var(--gold); border-radius:12px; width:min(820px,100%); max-height:100%; overflow:auto; padding:12px; }
#dlg textarea { width:100%; height:34vh; background:#100c09; border:1px solid var(--line); border-radius:6px; padding:8px; font:12px/1.3 ui-monospace,Consolas,monospace; }
#msgs { margin:8px 0; font-size:13px; max-height:22vh; overflow:auto; }
#msgs .e { color:var(--bad); } #msgs .w { color:var(--warn); } #msgs .g { color:var(--good); }
@media (min-width: 900px) and (min-height: 500px) {
  #main { grid-template-columns:1fr 360px; grid-template-rows:1fr; }
  #side { max-height:none; border-top:0; border-left:2px solid var(--line); }
}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="grp" id="modes">
      <button data-mode="move" class="on" title="Тягни вузол, щоб пересунути. Тап — вибрати.">✋ Рух</button>
      <button data-mode="link" title="Тапни два вузли: зв'язок з'явиться або зникне.">🔗 Зв'язки</button>
      <button data-mode="add" title="Тапни порожнє місце, щоб додати вузол.">➕ Вузол</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button id="bUndo">↶</button><button id="bRedo">↷</button>
      <button id="bFit" title="Показати все Древо">⤢</button>
      <button id="bGrid" title="Прив'язка до сітки 10">▦</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button id="bIO">⇅ Імпорт / Експорт</button>
      <button id="bCheck">✔ Перевірити</button>
      <button id="bMeta">⚙ Класи й назва</button>
    </div>
    <div id="count" style="margin-left:auto;color:var(--dim);font-size:13px"></div>
  </div>
  <div id="main">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="toast"></div>
      <div id="hint"></div>
    </div>
    <div id="side"></div>
  </div>
</div>

<div id="dlg"><div class="box" id="dlgbox"></div></div>

    var typ = nd.type === undefined ? "" : String(nd.type);

    var st = nd.stats === undefined ? {} : nd.stats;
    if (st === null || typeof st !== "object" || Array.isArray(st)) errors.push(tag + ": stats має бути об'єктом.");
    else Object.keys(st).forEach(function (k) {
      if (STAT_KEYS.indexOf(k) < 0) errors.push(tag + ": невідомий бонус «" + k + "».");
      else if (!isNum(st[k])) errors.push(tag + ": бонус «" + k + "» має бути числом.");
    });

    if ("starter" in nd && typeof nd.starter !== "boolean") errors.push(tag + ": starter має бути true або false.");

    var mm = nd.mods === undefined ? {} : nd.mods;
    if (msk !== "" && SKILL_IDS.indexOf(msk) < 0) errors.push(tag + ": mod_skill — невідома навичка «" + msk + "».");
    if (mm === null || typeof mm !== "object" || Array.isArray(mm)) errors.push(tag + ": mods має бути об'єктом.");
    else {
      if (Object.keys(mm).length > 0 && msk === "") errors.push(tag + ": mods потребує поля mod_skill.");
      Object.keys(mm).forEach(function (k) {
        if (MOD_KEYS.indexOf(k) < 0) errors.push(tag + ": невідоме поліпшення «" + k + "».");
        else if (!isNum(mm[k])) errors.push(tag + ": поліпшення «" + k + "» має бути числом.");

    if (seen[k2]) { errors.push(tag2 + ": повтор зв'язку " + a + " — " + b + "."); return; }

  else CLASS_IDS.forEach(function (c) {
    if (!(c in cs)) errors.push("class_starts: немає класу «" + c + "».");
    else if (!ids[String(cs[c])]) errors.push("class_starts: вузла «" + String(cs[c]) + "» (клас «" + c + "») не існує.");
    else startIds.push(String(cs[c]));

  if (errors.length === 0 && startIds.length > 0) {

  }
  return { errors: errors, warnings: warnings };
}

// Той самий вигляд, що й data/perk_tree.json (відступ 1 пробіл)
function serializeTree(d) { return JSON.stringify(d, null, 1) + "\n"; }

// Приводить вузол до повного вигляду (усі поля, у тому самому порядку)
function normalizeNode(n) {
  var stats = {};
  if (n.stats && typeof n.stats === "object") STAT_KEYS.forEach(function (k) { if (k in n.stats && isNum(n.stats[k]) && n.stats[k] !== 0) stats[k] = n.stats[k]; });
  var out = { id: n.id, name: n.name, description: n.description || "", x: n.x, y: n.y, type: n.type, stats: stats, skill: n.skill || "", icon: n.icon || "", region: n.region || "" };
  if (n.starter === true) out.starter = true;
  if (n.mod_skill) {
    out.mod_skill = n.mod_skill;
    var mods = {};
    if (n.mods && typeof n.mods === "object") MOD_KEYS.forEach(function (k) { if (k in n.mods && isNum(n.mods[k]) && n.mods[k] !== 0) mods[k] = n.mods[k]; });
    out.mods = mods;
  }

}

<script>
(function () {
"use strict";
var $ = function (s) { return document.querySelector(s); };
var cv = $("#cv"), ctx = cv.getContext("2d");
var data = null;            // поточне Древо (той самий формат, що й файл)
var undo = [], redo = [], last = "";
var mode = "move", sel = null, linkFrom = null, snap = false;
var view = { x: 0, y: 0, k: 0.4 };
var DPR = Math.max(1, window.devicePixelRatio || 1);
var regionColors = { mixed: "#c9a24a", core: "#f1e6cf" };

    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);

}
function toast(t, ms) {

  clearTimeout(toast.t); toast.t = setTimeout(function () { b.style.display = "none"; }, ms || 2200);
}

// ---------- Дані ----------
function loadDefault() { return JSON.parse($("#default-tree").textContent); }
function prepare(d) {

}

function persist() { try { localStorage.setItem(STORE, snapshot()); } catch (e) {} }
function restore(s) { data = prepare(JSON.parse(s)); last = s; if (sel && !nodeById(sel)) sel = null; linkFrom = null; persist(); refresh(); }

}

}

// ---------- Малювання ----------
function resize() {

}
function w2s(x, y) { return [x * view.k + view.x, y * view.k + view.y]; }
function s2w(x, y) { return [(x - view.x) / view.k, (y - view.y) / view.k]; }
var RADIUS = { small: 13, notable: 20, keystone: 28, skill: 22, start: 26, core: 36 };
function nodeR(n) { return RADIUS[n.type] || 13; }

    var ox = ((view.x % step) + step) % step, oy = ((view.y % step) + step) % step;

  ctx.strokeStyle = "#ffffff22"; ctx.beginPath(); ctx.moveTo(o[0] - 12, o[1]); ctx.lineTo(o[0] + 12, o[1]); ctx.moveTo(o[0], o[1] - 12); ctx.lineTo(o[0], o[1] + 12); ctx.stroke();

  });

  var starts = {}; Object.keys(data.class_starts).forEach(function (c) { starts[data.class_starts[c]] = c; });
  var fs = Math.max(10, Math.min(15, 13 * view.k * 1.6));
  ctx.textAlign = "center"; ctx.font = fs + "px system-ui,sans-serif";
  data.nodes.forEach(function (n) {
    var p = w2s(n.x, n.y); if (p[0] < -50 || p[1] < -50 || p[0] > W + 50 || p[1] > H + 50) return;
    var r = Math.max(5, nodeR(n) * view.k * 1.25);
    var col = regionColors[n.region] || "#999";
    ctx.beginPath();
    if (n.type === "keystone") { for (var i = 0; i < 6; i++) { var an = Math.PI / 3 * i; ctx.lineTo(p[0] + Math.cos(an) * r, p[1] + Math.sin(an) * r); } ctx.closePath(); }
    else if (n.type === "notable") { ctx.moveTo(p[0], p[1] - r); ctx.lineTo(p[0] + r, p[1]); ctx.lineTo(p[0], p[1] + r); ctx.lineTo(p[0] - r, p[1]); ctx.closePath(); }

    ctx.strokeStyle = isLink ? "#7fd0ff" : isSel ? "#fff" : (n.type === "small" ? "#00000088" : "#f2d58a");
    ctx.stroke();
    if (starts[n.id]) { ctx.fillStyle = "#fff"; ctx.font = "bold " + Math.max(10, r * .9) + "px system-ui"; ctx.fillText(starts[n.id][0].toUpperCase(), p[0], p[1] + r * .32); ctx.font = fs + "px system-ui,sans-serif"; }
    if (view.k > 0.45 || isSel || n.type === "keystone" || n.type === "core") {

        ctx.fillStyle = "#f1e6cf"; ctx.strokeStyle = "#000"; ctx.lineWidth = 3;
        ctx.strokeText(n.name, p[0], p[1] + r + fs + 1); ctx.fillText(n.name, p[0], p[1] + r + fs + 1);
      }
    }

}
function fit() {
  if (!data || !data.nodes.length) return;
  var r = cv.getBoundingClientRect(), x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;

  view.x = r.width / 2 - ((x0 + x1) / 2) * view.k; view.y = r.height / 2 - ((y0 + y1) / 2) * view.k;

}
function pick(sx, sy) {
  var best = null, bd = 1e9;
  data.nodes.forEach(function (n) {
    var p = w2s(n.x, n.y), d = Math.hypot(p[0] - sx, p[1] - sy), r = Math.max(20, nodeR(n) * view.k * 1.25 + 8);
    if (d < r && d < bd) { bd = d; best = n; }

// ---------- Дотики та миша ----------
var ptrs = {}, drag = null, pinch = null;

cv.addEventListener("pointerdown", function (e) {

    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), c: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] };

function tap(p, n) {

    sel = n ? n.id : null; fillSide(); draw(); return;
  }

    if (!linkFrom) { linkFrom = n.id; sel = n.id; fillSide(); draw(); hint(); return; }

// ---------- Бічна панель ----------

  }

    box.appendChild(el("div", { style: "color:var(--dim)", text: "Тапни вузол на полотні, щоб редагувати його. Два пальці — масштаб і зсув, один палець по порожньому — зсув. Режим «➕ Вузол»: тап по порожньому додає вузол (і з'єднує з вибраним)." }));

  }

  function field(label, input) { var r = el("div", { "class": "row" }, [el("label", { text: label }), input]); box.appendChild(r); return input; }
  function text(prop, id, area) {
    var i = el(area ? "textarea" : "input", { id: id, rows: 2 });
    i.value = n[prop];
    i.addEventListener("input", function () { n[prop] = i.value; draw(); });
    i.addEventListener("change", function () { commit(); });
    return i;
  }
  var idIn = field("Ідентифікатор", el("input", { id: "f_id" })); idIn.value = n.id;
  idIn.addEventListener("change", function () {
    var v = idIn.value.trim();

    data.links.forEach(function (l) { if (l[0] === old) l[0] = v; if (l[1] === old) l[1] = v; });
    Object.keys(data.class_starts).forEach(function (c) { if (data.class_starts[c] === old) data.class_starts[c] = v; });
    sel = v; if (linkFrom === old) linkFrom = v; commit();
  });
  field("Назва", text("name", "f_name"));
  field("Опис", text("description", "f_desc", true));
  var xi = field("x", el("input", { id: "f_x", type: "number", step: "10" })); xi.value = n.x;
  var yi = field("y", el("input", { id: "f_y", type: "number", step: "10" })); yi.value = n.y;

  NODE_TYPES.forEach(function (t) { var o = el("option", { value: t, text: TYPE_NAMES[t] + " (" + t + ")" }); if (t === n.type) o.selected = true; ts.appendChild(o); });
  ts.addEventListener("change", function () { n.type = ts.value; commit(); fillSide(); });
  var rs = field("Регіон", el("select"));
  data.regions.map(function (r) { return [r.id, r.name]; }).concat([["mixed", "Змішаний"], ["core", "Серце"]]).forEach(function (r) {
    var o = el("option", { value: r[0], text: r[1] + " (" + r[0] + ")" }); if (r[0] === n.region) o.selected = true; rs.appendChild(o);
  });
  rs.addEventListener("change", function () { n.region = rs.value; commit(); });
  var ss = field("Навичка", el("select"));
  ss.appendChild(el("option", { value: "", text: "— немає —" }));
  SKILL_IDS.forEach(function (s) { var o = el("option", { value: s, text: SKILL_NAMES[s] + " (" + s + ")" }); if (s === n.skill) o.selected = true; ss.appendChild(o); });
  ss.addEventListener("change", function () { n.skill = ss.value; commit(); });
  if (n.type === "skill") {
    var stc = el("input", { type: "checkbox" }); stc.checked = n.starter === true;
    stc.addEventListener("change", function () { if (stc.checked) n.starter = true; else delete n.starter; commit(); });
    box.appendChild(el("label", { style: "display:block;margin:6px 0;color:var(--dim);font-size:13px" }, [stc, document.createTextNode(" Стартова навичка (одна з трьох на вибір при вході в гру)")]));
  }
  var ms = field("Поліпшує навичку", el("select"));
  ms.appendChild(el("option", { value: "", text: "— нічого —" }));
  SKILL_IDS.forEach(function (s2) { var o = el("option", { value: s2, text: SKILL_NAMES[s2] + " (" + s2 + ")" }); if (s2 === n.mod_skill) o.selected = true; ms.appendChild(o); });
  ms.addEventListener("change", function () { if (ms.value) { n.mod_skill = ms.value; n.mods = n.mods || {}; } else { delete n.mod_skill; delete n.mods; } commit(); fillSide(); });
  if (n.mod_skill) {
    box.appendChild(el("div", { style: "color:var(--dim);font-size:13px;margin:4px 0", text: "Поліпшення навички (0 = немає):" }));
    var mg = el("div", { "class": "stats" });
    MOD_KEYS.forEach(function (k) {
      var mi = el("input", { type: "number", step: "any", inputmode: "decimal" }); mi.value = (n.mods && n.mods[k]) || 0;
      mi.addEventListener("input", function () { var v = parseFloat(mi.value); n.mods = n.mods || {}; if (isFinite(v) && v !== 0) n.mods[k] = v; else delete n.mods[k]; });
      mi.addEventListener("change", function () { commit(); });
      mg.appendChild(el("div", null, [el("label", { text: MOD_NAMES[k] }), mi]));
    });
    box.appendChild(mg);
  }
  var ic = field("Іконка", el("input", { list: "icons", placeholder: "порожньо = за регіоном і типом" })); ic.value = n.icon;
  var dl = el("datalist", { id: "icons" }); ICON_KEYS.forEach(function (k) { dl.appendChild(el("option", { value: k })); }); box.appendChild(dl);
  ic.addEventListener("input", function () { n.icon = ic.value.trim(); });
  ic.addEventListener("change", function () { commit(); });
  box.appendChild(el("div", { style: "color:var(--dim);font-size:13px;margin:4px 0", text: "Бонуси (0 = немає):" }));
  var grid = el("div", { "class": "stats" });
  STAT_KEYS.forEach(function (k) {
    var i = el("input", { type: "number", step: "any", inputmode: "decimal" }); i.value = n.stats[k] || 0;
    i.addEventListener("input", function () { var v = parseFloat(i.value); if (isFinite(v) && v !== 0) n.stats[k] = v; else delete n.stats[k]; });
    i.addEventListener("change", function () { commit(); });
    grid.appendChild(el("div", null, [el("label", { text: STAT_NAMES[k] }), i]));
  });
  box.appendChild(grid);
  var starts = CLASS_IDS.filter(function (c) { return data.class_starts[c] === n.id; });
  if (starts.length) box.appendChild(el("div", { style: "margin:4px 0" }, [el("span", { "class": "badge", text: "Старт: " + starts.map(function (c) { return CLASS_NAMES[c]; }).join(", ") })]));
  var nb = []; data.links.forEach(function (l) { if (l[0] === n.id) nb.push(l[1]); else if (l[1] === n.id) nb.push(l[0]); });
  box.appendChild(el("div", { style: "color:var(--dim);font-size:13px;margin:4px 0", text: "Сусіди (" + nb.length + "): " + (nb.join(", ") || "—") }));
  var br = el("div", { "class": "row" });
  br.appendChild(el("button", { text: "🔗 З'єднувати цей", onclick: function () { setMode("link"); linkFrom = n.id; draw(); hint(); } }));
  br.appendChild(el("button", { text: "⧉ Дублювати", onclick: function () {
    var c = JSON.parse(JSON.stringify(n)); c.id = nextId(); c.x += 60; c.y += 60; c.name = n.name + " (копія)";
    data.nodes.push(normalizeNode(c)); sel = c.id; commit();
  } }));
  br.appendChild(el("button", { "class": "danger", text: "🗑 Видалити вузол", onclick: function () {
    if (!confirm("Видалити вузол «" + n.name + "» і всі його зв'язки?")) return;
    data.nodes = data.nodes.filter(function (m) { return m.id !== n.id; });
    data.links = data.links.filter(function (l) { return l[0] !== n.id && l[1] !== n.id; });
    var lost = CLASS_IDS.filter(function (c) { return data.class_starts[c] === n.id; });
    lost.forEach(function (c) { delete data.class_starts[c]; });
    sel = null; linkFrom = null; commit();
    toast(lost.length ? "Видалено старт класу — призначте новий у «⚙ Класи й назва»" : "Вузол видалено", 3500);
  } }));
  box.appendChild(br);
}
function hint() {
  var h = { move: "Рух: тягни вузол, щоб пересунути; тап — вибрати. Порожнє місце — зсув; два пальці — масштаб.", link: linkFrom ? "Зв'язки: тапни другий вузол — зв'язок з'явиться або зникне (якщо вже був)." : "Зв'язки: тапни перший вузол.", add: "Вузол: тапни порожнє місце. Якщо вузол вибрано, новий з'єднається з ним." };
  $("#hint").textContent = h[mode];
}
function setMode(m) {
  mode = m; linkFrom = null;
  document.querySelectorAll("#modes button").forEach(function (b) { b.classList.toggle("on", b.dataset.mode === m); });
  hint(); draw();
}
function refresh() { fillSide(); draw(); $("#bUndo").disabled = !undo.length; $("#bRedo").disabled = !redo.length; }

// ---------- Діалоги ----------
function openDlg(build) { var b = $("#dlgbox"); b.innerHTML = ""; build(b); $("#dlg").style.display = "flex"; }
function closeDlg() { $("#dlg").style.display = "none"; }
function showMsgs(box, v) {
  box.innerHTML = "";
  v.errors.forEach(function (m) { box.appendChild(el("div", { "class": "e", text: "✖ " + m })); });
  v.warnings.forEach(function (m) { box.appendChild(el("div", { "class": "w", text: "⚠ " + m })); });
  if (!v.errors.length && !v.warnings.length) box.appendChild(el("div", { "class": "g", text: "✔ Усе гаразд: Древо відповідає формату гри." }));
}
function exportObj() {
  var d = JSON.parse(snapshot());
  d.nodes = d.nodes.map(normalizeNode);
  var out = { format: FORMAT, version: VERSION, title: d.title || "Древо звитяги", comment: d.comment || "", regions: d.regions, class_starts: d.class_starts, nodes: d.nodes, links: d.links };
  return out;
}
function download(name, text) {
  var a = el("a", { href: URL.createObjectURL(new Blob([text], { type: "application/json" })), download: name });
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function ioDialog() {
  openDlg(function (b) {
    b.appendChild(el("h3", { text: "Імпорт / Експорт JSON", style: "margin-top:0;color:var(--gold)" }));
    b.appendChild(el("div", { style: "color:var(--dim);font-size:13px;margin-bottom:6px", text: "Гра читає res://data/perk_tree.json. Збережіть файл із назвою perk_tree.json у теці data/ проєкту (або надішліть його розробнику). Щоб відкрити своє Древо — вставте JSON у поле нижче або оберіть файл." }));
    var ta = el("textarea", { spellcheck: "false" });
    ta.value = serializeTree(exportObj());
    b.appendChild(ta);
    var msgs = el("div", { id: "msgs" }); b.appendChild(msgs);
    showMsgs(msgs, validateTree(exportObj()));
    var row = el("div", { "class": "row" });
    row.appendChild(el("button", { text: "⬇ Завантажити perk_tree.json", onclick: function () {
      var o = exportObj(), v = validateTree(o); showMsgs(msgs, v);
      if (v.errors.length && !confirm("У Древі є помилки (" + v.errors.length + "), гра його не прийме. Все одно завантажити?")) return;
      var t = serializeTree(o); ta.value = t; download("perk_tree.json", t); toast("Файл perk_tree.json завантажено");
    } }));
    row.appendChild(el("button", { text: "⧉ Скопіювати", onclick: function () {
      ta.value = serializeTree(exportObj()); ta.select();
      var done = function () { toast("JSON скопійовано"); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, function () { document.execCommand("copy"); done(); });
      else { try { document.execCommand("copy"); } catch (e) {} done(); }
    } }));
    var file = el("input", { type: "file", accept: ".json,application/json,text/plain", style: "display:none" });
    file.addEventListener("change", function () {
      var f = file.files[0]; if (!f) return;
      var rd = new FileReader(); rd.onload = function () { ta.value = String(rd.result); applyText(); }; rd.readAsText(f, "utf-8");
    });
    row.appendChild(file);
    row.appendChild(el("button", { text: "📂 Відкрити файл…", onclick: function () { file.click(); } }));
    function applyText() {
      var d;
      try { d = JSON.parse(ta.value); } catch (e) { showMsgs(msgs, { errors: ["Це не JSON: " + e.message], warnings: [] }); return; }
      var v = validateTree(d); showMsgs(msgs, v);
      if (v.errors.length) { toast("Імпорт скасовано: є помилки"); return; }
      data = prepare(d); sel = null; linkFrom = null; commit(); fit();
      toast("Древо імпортовано: " + data.nodes.length + " вузлів");
    }
    row.appendChild(el("button", { "class": "on", text: "✔ Застосувати з поля", onclick: applyText }));
    row.appendChild(el("button", { text: "Закрити", onclick: closeDlg }));
    b.appendChild(row);
    var row2 = el("div", { "class": "row" });
    row2.appendChild(el("button", { "class": "danger", text: "↺ Скинути до стартового Древо", onclick: function () {
      if (!confirm("Повернути стартове Древо, що вбудовано в редактор? Поточні зміни можна скасувати кнопкою ↶.")) return;
      data = prepare(loadDefault()); sel = null; commit(); fit(); closeDlg();
    } }));
    b.appendChild(row2);
  });
}
function metaDialog() {
  openDlg(function (b) {
    b.appendChild(el("h3", { text: "Класи й назва", style: "margin-top:0;color:var(--gold)" }));
    var t = el("input", { value: data.title || "" });
    b.appendChild(el("div", { "class": "row" }, [el("label", { text: "Назва Древа" }), t]));
    t.addEventListener("change", function () { data.title = t.value; commit(); });
    CLASS_IDS.forEach(function (c) {
      var s = el("select");
      s.appendChild(el("option", { value: "", text: "— не призначено —" }));
      data.nodes.forEach(function (n) { var o = el("option", { value: n.id, text: n.id + " — " + n.name }); if (data.class_starts[c] === n.id) o.selected = true; s.appendChild(o); });
      s.addEventListener("change", function () { if (s.value) data.class_starts[c] = s.value; else delete data.class_starts[c]; commit(); });
      b.appendChild(el("div", { "class": "row" }, [el("label", { text: "Старт: " + CLASS_NAMES[c] }), s]));
    });
    b.appendChild(el("div", { style: "color:var(--dim);font-size:13px", text: "Кожен клас починає гру з відкритим стартовим вузлом; далі можна брати лише сусідні вузли." }));
    b.appendChild(el("div", { "class": "row" }, [el("button", { text: "Закрити", onclick: closeDlg })]));
  });
}
function checkDialog() {
  openDlg(function (b) {
    b.appendChild(el("h3", { text: "Перевірка Древа", style: "margin-top:0;color:var(--gold)" }));
    var msgs = el("div", { id: "msgs", style: "max-height:50vh" }); b.appendChild(msgs);
    showMsgs(msgs, validateTree(exportObj()));
    b.appendChild(el("div", { "class": "row" }, [el("button", { text: "Закрити", onclick: closeDlg })]));
  });
}

// ---------- Старт ----------
document.querySelectorAll("#modes button").forEach(function (b) { b.addEventListener("click", function () { setMode(b.dataset.mode); }); });
$("#bUndo").addEventListener("click", function () { if (!undo.length) return; redo.push(last); restore(undo.pop()); });
$("#bRedo").addEventListener("click", function () { if (!redo.length) return; undo.push(last); restore(redo.pop()); });
$("#bFit").addEventListener("click", fit);
$("#bGrid").addEventListener("click", function () { snap = !snap; $("#bGrid").classList.toggle("on", snap); toast(snap ? "Сітка 10: увімкнено" : "Сітка вимкнено"); });
$("#bIO").addEventListener("click", ioDialog);
$("#bCheck").addEventListener("click", checkDialog);
$("#bMeta").addEventListener("click", metaDialog);
$("#dlg").addEventListener("pointerdown", function (e) { if (e.target === $("#dlg")) closeDlg(); });
window.addEventListener("resize", resize);
window.addEventListener("keydown", function (e) {
  var tag = (e.target.tagName || "").toLowerCase(); if (tag === "input" || tag === "textarea" || tag === "select") return;
  if ((e.ctrlKey || e.metaKey) && e.key === "z") { e.preventDefault(); $("#bUndo").click(); }
  else if ((e.ctrlKey || e.metaKey) && (e.key === "y" || (e.shiftKey && e.key === "Z"))) { e.preventDefault(); $("#bRedo").click(); }
  else if (e.key === "Delete" && sel) { var b = document.querySelector("#side .danger"); if (b) b.click(); }
});

var saved = null;
try { saved = localStorage.getItem(STORE); } catch (e) {}
var start = null;
if (saved) { try { var sd = JSON.parse(saved); if (validateTree(sd).errors.length === 0) start = sd; } catch (e) {} }
data = prepare(start || loadDefault()); last = snapshot();
window.__editor = { get data() { return data; }, validate: function () { return validateTree(exportObj()); }, exportText: function () { return serializeTree(exportObj()); } };
resize(); fit(); setMode("move"); refresh();
if (start) toast("Відновлено вашу останню роботу (автозбереження в браузері)", 3000);
})();
</script>
</body>
</html>
