<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Редактор Древа звитяги — «Спогади пращурів»</title>
<style>
:root { --bg:#16120f; --panel:#241d18; --panel2:#2e251e; --line:#5b4630; --gold:#d9b25b; --text:#f1e6cf; --dim:#a89a82; --bad:#e0624f; --good:#7cbf5a; --warn:#e0b04f; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
#app { display:grid; height:100%; grid-template-rows:auto 1fr; grid-template-columns:1fr; }
#bar { display:flex; flex-wrap:wrap; gap:6px; padding:6px; background:var(--panel); border-bottom:2px solid var(--line); align-items:center; }
#bar .grp { display:flex; gap:4px; flex-wrap:wrap; }
#bar .sep { width:1px; height:30px; background:var(--line); margin:0 2px; }
button, select, input, textarea { font:inherit; color:var(--text); }
button { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:9px 11px; min-height:42px; cursor:pointer; touch-action:manipulation; }
button:active { background:#43362a; }
button.on { background:var(--gold); color:#20170c; border-color:var(--gold); font-weight:600; }
button.danger { border-color:var(--bad); color:#ffb4a8; }
button:disabled { opacity:.4; }
#main { display:grid; min-height:0; grid-template-columns:1fr; grid-template-rows:1fr auto; }
#stage { position:relative; min-height:0; overflow:hidden; background:radial-gradient(circle at 50% 50%, #251d16, #120e0b); }
canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
#hint { position:absolute; left:8px; bottom:8px; right:8px; pointer-events:none; color:var(--dim); font-size:13px; text-shadow:0 1px 2px #000; }
#toast { position:absolute; left:50%; top:10px; transform:translateX(-50%); background:#000d; border:1px solid var(--gold); padding:8px 14px; border-radius:10px; display:none; max-width:90%; z-index:5; text-align:center; }
#side { background:var(--panel); border-top:2px solid var(--line); max-height:42vh; overflow:auto; padding:8px; }
#side h3 { margin:0 0 6px; font-size:15px; color:var(--gold); }
.row { display:flex; gap:6px; margin-bottom:6px; align-items:center; flex-wrap:wrap; }
.row > label { flex:0 0 96px; color:var(--dim); font-size:13px; }
.row > input, .row > select, .row > textarea { flex:1 1 140px; min-width:0; background:#17120e; border:1px solid var(--line); border-radius:6px; padding:8px; min-height:38px; }
.stats { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:6px; margin:4px 0 8px; }
.stats div { display:flex; align-items:center; gap:4px; }
.stats label { flex:1; font-size:12px; color:var(--dim); }
.stats input { width:64px; background:#17120e; border:1px solid var(--line); border-radius:6px; padding:6px; min-height:34px; }
.badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px; border:1px solid var(--line); margin-right:4px; }
#dlg { position:fixed; inset:0; background:#000c; display:none; align-items:center; justify-content:center; z-index:10; padding:8px; }
#dlg .box { background:var(--panel); border:2px solid var(--gold); border-radius:12px; width:min(820px,100%); max-height:100%; overflow:auto; padding:12px; }
#dlg textarea { width:100%; height:34vh; background:#100c09; border:1px solid var(--line); border-radius:6px; padding:8px; font:12px/1.3 ui-monospace,Consolas,monospace; }
#msgs { margin:8px 0; font-size:13px; max-height:22vh; overflow:auto; }
#msgs .e { color:var(--bad); } #msgs .w { color:var(--warn); } #msgs .g { color:var(--good); }
@media (min-width: 900px) and (min-height: 500px) {
  #main { grid-template-columns:1fr 360px; grid-template-rows:1fr; }
  #side { max-height:none; border-top:0; border-left:2px solid var(--line); }
}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="grp" id="modes">
      <button data-mode="move" class="on" title="Тягни вузол, щоб пересунути. Тап — вибрати.">✋ Рух</button>
      <button data-mode="link" title="Тапни два вузли: зв'язок з'явиться або зникне.">🔗 Зв'язки</button>
      <button data-mode="add" title="Тапни порожнє місце, щоб додати вузол.">➕ Вузол</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button id="bUndo">↶</button><button id="bRedo">↷</button>
      <button id="bFit" title="Показати все Древо">⤢</button>
      <button id="bGrid" title="Прив'язка до сітки 10">▦</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button id="bIO">⇅ Імпорт / Експорт</button>
      <button id="bCheck">✔ Перевірити</button>
      <button id="bMeta">⚙ Класи й назва</button>
    </div>
    <div id="count" style="margin-left:auto;color:var(--dim);font-size:13px"></div>
  </div>
  <div id="main">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="toast"></div>
      <div id="hint"></div>
    </div>
    <div id="side"></div>
  </div>
</div>

<div id="dlg"><div class="box" id="dlgbox"></div></div>

      var cur = queue.pop();

    }
    Object.keys(ids).forEach(function (k) { if (!reach[k]) warnings.push("Вузол «" + k + "» недосяжний з жодного старту."); });
  }

// Той самий вигляд, що й data/perk_tree.json (відступ 1 пробіл)
function serializeTree(d) { return JSON.stringify(d, null, 1) + "\n"; }

// Приводить вузол до повного вигляду (усі поля, у тому самому порядку)
function normalizeNode(n) {
  var stats = {};
  if (n.stats && typeof n.stats === "object") STAT_KEYS.forEach(function (k) { if (k in n.stats && isNum(n.stats[k]) && n.stats[k] !== 0) stats[k] = n.stats[k]; });
  var out = { id: n.id, name: n.name, description: n.description || "", x: n.x, y: n.y, type: n.type, stats: stats, skill: n.skill || "", icon: n.icon || "", region: n.region || "" };
  if (n.starter === true) out.starter = true;
  if (n.mod_skill) {
    out.mod_skill = n.mod_skill;
    var mods = {};
    if (n.mods && typeof n.mods === "object") MOD_KEYS.forEach(function (k) { if (k in n.mods && isNum(n.mods[k]) && n.mods[k] !== 0) mods[k] = n.mods[k]; });
    out.mods = mods;
  }
  return out;
}

<script>
(function () {

var undo = [], redo = [], last = "";

function draw() {

  ctx.clearRect(0, 0, W, H);

  data.nodes.forEach(function (n) {

    if (view.k > 0.45 || isSel || n.type === "keystone" || n.type === "core") {

function tap(p, n) {

  if ((e.ctrlKey || e.metaKey) && e.key === "z") { e.preventDefault(); $("#bUndo").click(); }
  else if ((e.ctrlKey || e.metaKey) && (e.key === "y" || (e.shiftKey && e.key === "Z"))) { e.preventDefault(); $("#bRedo").click(); }
  else if (e.key === "Delete" && sel) { var b = document.querySelector("#side .danger"); if (b) b.click(); }
});

var saved = null;
try { saved = localStorage.getItem(STORE); } catch (e) {}
var start = null;
if (saved) { try { var sd = JSON.parse(saved); if (validateTree(sd).errors.length === 0) start = sd; } catch (e) {} }
data = prepare(start || loadDefault()); last = snapshot();
window.__editor = { get data() { return data; }, validate: function () { return validateTree(exportObj()); }, exportText: function () { return serializeTree(exportObj()); } };
resize(); fit(); setMode("move"); refresh();
if (start) toast("Відновлено вашу останню роботу (автозбереження в браузері)", 3000);
})();
